<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>야구 스코어 리모컨</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #121212; color: white; margin: 0; padding: 10px; touch-action: manipulation; overflow-x: hidden; }
        #status { text-align: center; font-size: 13px; font-weight: bold; color: #FF453A; margin-bottom: 10px; padding: 6px; background: #222; border-radius: 8px; }
        .card { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        button { font-size: 16px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; color: white; padding: 10px; display: flex; align-items: center; justify-content: center; }
        button:active { opacity: 0.7; }
        .grid-score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .team-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .team-input { width: 100%; background: #1c1c1e; border: 1px solid #444; color: white; font-size: 16px; font-weight: bold; text-align: center; padding: 8px 0; border-radius: 6px; min-width: 0; }
        .score-ctrl { display: flex; gap: 5px; }
        .btn-plus { background: #0A84FF; flex: 2; font-size: 20px; }
        .btn-minus { background: #FF453A; flex: 1; font-size: 20px; }
        .score-display { text-align: center; font-size: 28px; font-weight: 900; color: #FFD700; margin-top: -5px; }
        .grid-middle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .base-grid { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; }
        .btn-base { width: 35px; height: 35px; background: #444; border: 2px solid #666; transform: rotate(45deg); margin: 6px; }
        .btn-base.on { background: #FFD600; border-color: #FFD600; }
        .base-row-mid { display: flex; gap: 30px; margin-top: -15px; }
        .inning-ctrl { display: flex; flex-direction: column; justify-content: center; gap: 8px; text-align: center; }
        .inning-text { font-size: 20px; font-weight: bold; }
        .btn-inning { background: #32D74B; font-size: 14px; }
        .bso-row { display: grid; grid-template-columns: 2fr 3fr; gap: 10px; align-items: center; margin-bottom: 8px; }
        .dot { width: 20px; height: 20px; border-radius: 50%; background: #333; border: 2px solid #555; }
        .dot.B.on { background: #00FF41; border-color: #00FF41; }
        .dot.S.on { background: #FFEB3B; border-color: #FFEB3B; }
        .dot.O.on { background: #FF3B30; border-color: #FF3B30; }
    </style>
</head>
<body>

<div id="status">📡 방송 연결 시도 중...</div>

<div class="card grid-score">
    <div class="team-col">
        <input type="text" id="in-name-a" class="team-input" value="빅드림" onchange="saveAndSend()">
        <div class="score-display" id="disp-score-a">0</div>
        <div class="score-ctrl"><button class="btn-minus" onclick="addScore('a', -1)">-</button><button class="btn-plus" onclick="addScore('a', 1)">+</button></div>
    </div>
    <div class="team-col">
        <input type="text" id="in-name-b" class="team-input" value="상대팀" onchange="saveAndSend()">
        <div class="score-display" id="disp-score-b">0</div>
        <div class="score-ctrl"><button class="btn-minus" onclick="addScore('b', -1)">-</button><button class="btn-plus" onclick="addScore('b', 1)">+</button></div>
    </div>
</div>

<div class="card grid-middle">
    <div class="base-grid">
        <div id="btn-base2" class="btn-base" onclick="toggleBase(2)"></div>
        <div class="base-row-mid"><div id="btn-base3" class="btn-base" onclick="toggleBase(3)"></div><div id="btn-base1" class="btn-base" onclick="toggleBase(1)"></div></div>
    </div>
    <div class="inning-ctrl">
        <div class="inning-text" id="disp-inning">1회 초</div>
        <button class="btn-inning" onclick="changeInning(1)">다음 차례 ⏭</button>
        <button class="btn-inning" style="background:#666" onclick="changeInning(-1)">이전 ⏮</button>
    </div>
</div>

<div class="card">
    <div class="bso-row">
        <button style="background:#32D74B; color:black" onclick="addBSO('b')">볼 (B)</button>
        <div style="display:flex; gap:8px;"><div id="rb1" class="dot B"></div><div id="rb2" class="dot B"></div><div id="rb3" class="dot B"></div></div>
    </div>
    <div class="bso-row">
        <button style="background:#FFD60A; color:black" onclick="addBSO('s')">스트 (S)</button>
        <div style="display:flex; gap:8px;"><div id="rs1" class="dot S"></div><div id="rs2" class="dot S"></div></div>
    </div>
    <div class="bso-row">
        <button style="background:#FF453A" onclick="addBSO('o')">아웃 (O)</button>
        <div style="display:flex; gap:8px;"><div id="ro1" class="dot O"></div><div id="ro2" class="dot O"></div></div>
    </div>
    <button style="background:#444; width:100%; margin-top:5px;" onclick="resetBSO()">BSO 전체 초기화</button>
</div>

<script>
    const TARGET_ID = 'jiho-papa-live-viewer';
    const peer = new Peer();
    let conn;
    
    // 저장된 데이터 불러오기 또는 초기화
    let state = JSON.parse(localStorage.getItem('baseball_score_state')) || { 
        nameA: '빅드림', nameB: '상대팀', scoreA: 0, scoreB: 0, inning: 1, isTop: true, 
        base1: false, base2: false, base3: false, b: 0, s: 0, o: 0 
    };

    function updateStatus(msg, color) {
        const st = document.getElementById('status');
        st.innerHTML = msg; st.style.color = color;
    }

    function initConnection() {
        if (peer.disconnected) peer.reconnect();
        if (conn) conn.close();
        conn = peer.connect(TARGET_ID);
        conn.on('open', () => {
            updateStatus("✅ 방송 연결됨 <button onclick='initConnection()' style='background:#444; border:none; color:white; padding:2px 8px; margin-left:5px;'>🔄</button>", "#32D74B");
            saveAndSend();
        });
    }

    peer.on('open', initConnection);
    setInterval(() => { if (!conn || !conn.open) initConnection(); }, 4000);

    function saveAndSend() {
        state.nameA = document.getElementById('in-name-a').value;
        state.nameB = document.getElementById('in-name-b').value;
        localStorage.setItem('baseball_score_state', JSON.stringify(state));
        
        document.getElementById('disp-score-a').innerText = state.scoreA;
        document.getElementById('disp-score-b').innerText = state.scoreB;
        document.getElementById('disp-inning').innerText = state.inning + "회 " + (state.isTop ? '초' : '말');
        for(let i=1; i<=3; i++) document.getElementById('btn-base'+i).classList.toggle('on', state['base'+i]);
        for(let i=1; i<=3; i++) document.getElementById('rb'+i)?.classList.toggle('on', state.b >= i);
        for(let i=1; i<=2; i++) document.getElementById('rs'+i)?.classList.toggle('on', state.s >= i);
        for(let i=1; i<=2; i++) document.getElementById('ro'+i)?.classList.toggle('on', state.o >= i);
        
        if (conn && conn.open) conn.send(state);
    }

    function addScore(t, v) { if(t==='a') state.scoreA=Math.max(0, state.scoreA+v); else state.scoreB=Math.max(0, state.scoreB+v); saveAndSend(); }
    
    function toggleBase(n) { state['base'+n]=!state['base'+n]; saveAndSend(); }
    
    // ★ BSO 카운트 제어 핵심 로직
    function addBSO(t) { 
        state[t]++; 
        if(t === 'b' && state.b > 3) state.b = 0; 
        if(t === 's' && state.s > 2) state.s = 0; 
        
        // 아웃을 눌렀을 때의 동작 (볼, 스트라이크 초기화)
        if(t === 'o') {
            state.b = 0; 
            state.s = 0; 
            if(state.o > 2) {
                state.o = 0; // 쓰리아웃 시 아웃카운트를 0으로 비움
                // 공수교대(이닝변경)는 자동으로 넘기지 않고 수동 조작을 위해 남겨둠
            }
        }
        saveAndSend(); 
    }
    
    function resetBSO() { state.b=0; state.s=0; state.o=0; saveAndSend(); }
    
    // ★ 이닝 변경 시 제어 로직
    function changeInning(v) { 
        if(v===1) { 
            if(state.isTop) state.isTop=false; 
            else {state.isTop=true; state.inning++;}
        } else { 
            if(!state.isTop) state.isTop=true; 
            else {state.isTop=false; state.inning=Math.max(1, state.inning-1);}
        }
        
        // 이닝이 바뀌면(공수교대) 베이스의 모든 주자와 아웃/볼/스트라이크 카운트를 싹 비웁니다.
        state.base1 = false;
        state.base2 = false;
        state.base3 = false;
        state.b = 0;
        state.s = 0;
        state.o = 0;
        
        saveAndSend(); 
    }

    document.getElementById('in-name-a').value = state.nameA;
    document.getElementById('in-name-b').value = state.nameB;
    saveAndSend();
</script>
</body>
</html>
