<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>통합 야구 컨트롤러 - 최종본</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #121212; color: white; margin: 0; padding: 10px; touch-action: manipulation; }
        #status { text-align: center; font-size: 13px; font-weight: bold; color: #FF453A; margin-bottom: 10px; padding: 6px; background: #222; border-radius: 8px; }
        .card { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 10px; }

        /* 접속 암호 게이트 */
        #gate { position: fixed; inset: 0; background: #121212; z-index: 99999; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 14px; padding: 24px; }
        #gate .g-title { font-size: 20px; font-weight: bold; }
        #gate .g-desc { font-size: 13px; color: #aaa; text-align: center; line-height: 1.5; }
        #gate input { font-size: 26px; text-align: center; letter-spacing: 10px; width: 180px; padding: 12px;
                      border-radius: 10px; border: 1px solid #555; background: #1c1c1e; color: white; }
        #gate button { background: #FFD700; color: black; border: none; padding: 12px 34px; border-radius: 10px; font-size: 16px; font-weight: bold; }
        #gate .g-err { display: none; color: #FF453A; font-size: 13px; }

        /* 메인 탭 */
        .main-tab-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .main-tab-btn { flex: 1; padding: 12px 5px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; background: #444; color: white; }
        .main-tab-btn.active { background: #FFD700; color: black; }

        /* 스코어보드 조작 UI */
        .grid-score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .team-input { width: 100%; background: #1c1c1e; border: 1px solid #444; color: white; font-size: 14px; text-align: center; padding: 5px; border-radius: 6px; margin-bottom: 5px; }
        .score-display { text-align: center; font-size: 32px; font-weight: 900; color: #FFD700; }
        .score-ctrl { display: flex; gap: 5px; }
        .btn-s { flex: 1; padding: 10px; font-size: 18px; border-radius: 6px; border: none; color: white; font-weight: bold; }
        .btn-plus { background: #0A84FF; } .btn-minus { background: #FF453A; }

        .middle-ctrl { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; margin: 10px 0; }
        .base-grid { display: flex; flex-direction: column; align-items: center; gap: 5px; background: #1c1c1e; padding: 10px; border-radius: 10px; }
        .btn-base { width: 30px; height: 30px; background: #444; border: 2px solid #666; transform: rotate(45deg); }
        .btn-base.on { background: #FFD600; border-color: #FFD600; }

        .bso-card { display: flex; flex-direction: column; gap: 8px; }
        .bso-row { display: flex; align-items: center; gap: 10px; }
        /* 💡 BSO 동그라미 크기 17px로 원복 */
        .dot { width: 17px; height: 17px; border-radius: 50%; background: #333; border: 1.5px solid #555; }
        .dot.B.on { background: #00FF41; border-color: #00FF41; box-shadow: 0 0 5px #00FF41; }
        .dot.S.on { background: #FFEB3B; border-color: #FFEB3B; box-shadow: 0 0 5px #FFEB3B; }
        .dot.O.on { background: #FF3B30; border-color: #FF3B30; box-shadow: 0 0 5px #FF3B30; }

        /* 하단 타석 실시간 조작 UI */
        .game-op-card { border-top: 2px solid #444; margin-top: 5px; padding-top: 15px; }
        .class-sel-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .class-small-btn { flex: 1; padding: 8px; font-size: 12px; border-radius: 5px; border: 1px solid #555; background: #222; color: #ccc; font-weight: bold; }
        .class-small-btn.active { background: #32D74B; color: black; border-color: #32D74B; }

        .batter-info-box { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* 💡 이전/다음 타자 버튼 그룹 */
        .nav-btn-group { display: flex; gap: 4px; }
        .nav-btn { background: #0A84FF; padding: 10px 12px; font-size: 13px; border-radius: 6px; border: none; color: white; font-weight: bold; }
        .nav-btn.prev { background: #555; }

        /* 💡 결과 버튼 그리드 (4줄로 확장) */
        .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .btn-res { padding: 12px 5px; font-size: 13px; border-radius: 5px; border: none; background: #444; color: white; font-weight: bold; }
        .btn-res.hit { background: #32D74B; color: black; }
        .btn-res.hr { background: #FFD60A; color: black; }
        .btn-res.out-special { background: #8B4513; color: white; } /* 병살/삼중살용 색상 */

        /* 라인업 설정 UI */
        .order-item { display: flex; align-items: center; gap: 5px; background: #3a3a3c; padding: 6px; border-radius: 8px; margin-bottom: 5px; }
        .player-sel { flex: 3; background: #1c1c1e; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 14px; }
        .pos-sel { flex: 1.5; background: #222; color: #FFD700; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 12px; }

        .reset-btn { border:none; padding:8px; border-radius:5px; color:white; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>

<!-- 🔒 접속 암호 게이트(당일 날짜 MMDD) -->
<div id="gate">
    <div class="g-title">🔒 인증</div>
    <input id="gate-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"
           autocomplete="off" onkeydown="if(event.key==='Enter')submitGate()">
    <button onclick="submitGate()">입장</button>
    <div id="gate-err" class="g-err">암호가 올바르지 않습니다.</div>
</div>

<div id="status">📡 연결 중...</div>

<div class="main-tab-container">
    <button id="mtab-score" class="main-tab-btn active" onclick="setMainTab('score')">🎮 스코어</button>
    <button id="mtab-새싹" class="main-tab-btn" onclick="setMainTab('새싹')">🌱 새싹</button>
    <button id="mtab-꿈나무" class="main-tab-btn" onclick="setMainTab('꿈나무')">🌿 꿈나무</button>
    <button id="mtab-유소년" class="main-tab-btn" onclick="setMainTab('유소년')">⚾ 유소년</button>
</div>

<div id="panel-score">
    <div class="card">
        <div class="grid-score">
            <div class="team-col">
                <input type="text" id="nameA" class="team-input" onchange="updateScoreState()">
                <div class="score-display" id="disp-scoreA">0</div>
                <div class="score-ctrl"><button class="btn-s btn-minus" onclick="addScore('scoreA',-1)">-</button><button class="btn-s btn-plus" onclick="addScore('scoreA',1)">+</button></div>
            </div>
            <div class="team-col">
                <input type="text" id="nameB" class="team-input" onchange="updateScoreState()">
                <div class="score-display" id="disp-scoreB">0</div>
                <div class="score-ctrl"><button class="btn-s btn-minus" onclick="addScore('scoreB',-1)">-</button><button class="btn-s btn-plus" onclick="addScore('scoreB',1)">+</button></div>
            </div>
        </div>

        <div class="middle-ctrl">
            <div class="base-grid">
                <div id="mbase2" class="btn-base" onclick="toggleBase(2)"></div>
                <div style="display:flex; gap:35px; margin-top:-10px;">
                    <div id="mbase3" class="btn-base" onclick="toggleBase(3)"></div>
                    <div id="mbase1" class="btn-base" onclick="toggleBase(1)"></div>
                </div>
            </div>
            <div class="inning-ctrl" style="text-align:center;">
                <div id="disp-inning" style="font-size:20px; font-weight:bold; margin-bottom:5px;">1회 초</div>
                <button style="background:#32D74B; width:100%; border:none; padding:10px 5px; border-radius:5px; font-weight:bold; color:black; font-size:13px;" onclick="changeInning(1)">다음 이닝 ⏭</button>
                <button style="background:#666; width:100%; border:none; padding:6px 5px; border-radius:5px; margin-top:5px; font-size:11px; color:white;" onclick="changeInning(-1)">이전 이닝 ⏮</button>
            </div>
        </div>

        <div class="bso-card">
            <div class="bso-row">
                <button class="btn-s" style="flex:0 0 150px; background:#32D74B; color:black; padding:5px;" onclick="addBSO('b')">B</button>
                <div style="display:flex; gap:7px;"><div id="mb1" class="dot B"></div><div id="mb2" class="dot B"></div><div id="mb3" class="dot B"></div></div>
            </div>
            <div class="bso-row">
                <button class="btn-s" style="flex:0 0 150px; background:#FFD60A; color:black; padding:5px;" onclick="addBSO('s')">S</button>
                <div style="display:flex; gap:7px;"><div id="ms1" class="dot S"></div><div id="ms2" class="dot S"></div></div>
            </div>
            <div class="bso-row">
                <button class="btn-s" style="flex:0 0 150px; background:#FF3B30; padding:5px; color:white;" onclick="addBSO('o')">O</button>
                <div style="display:flex; gap:7px;"><div id="mo1" class="dot O"></div><div id="mo2" class="dot O"></div></div>
            </div>

            <div style="display:flex; gap:5px; margin-top:5px;">
                <button class="reset-btn" style="flex:1; background:#666;" onclick="resetBS()">B/S 초기화</button>
                <button class="reset-btn" style="flex:1; background:#FF453A;" onclick="resetBSO()">BSO 전체 초기화</button>
            </div>
        </div>
    </div>

    <div class="card game-op-card">
        <div class="class-sel-row">
            <button id="cs-새싹" class="class-small-btn" onclick="changeGameClass('새싹')">새싹</button>
            <button id="cs-꿈나무" class="class-small-btn" onclick="changeGameClass('꿈나무')">꿈나무</button>
            <button id="cs-유소년" class="class-small-btn" onclick="changeGameClass('유소년')">유소년</button>
        </div>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button id="gm-off" class="class-small-btn" onclick="setGameMode('offense')" style="flex:1">공격(타자)</button>
            <button id="gm-def" class="class-small-btn" onclick="setGameMode('defense')" style="flex:1">수비(투수)</button>
        </div>

        <div class="batter-info-box">
            <div id="live-batter-name" style="font-size:16px; font-weight:bold; color:#FFD700;">타자 정보</div>
            <div class="nav-btn-group" id="batter-nav-group">
                <button class="nav-btn prev" onclick="prevBatter()">이전</button>
                <button class="nav-btn" onclick="nextBatter()">다음</button>
            </div>
        </div>

        <div id="offense-controls">
            <div class="res-grid">
                <button class="btn-res" onclick="addGameRes('뜬공')">뜬공</button>
                <button class="btn-res" onclick="addGameRes('땅볼')">땅볼</button>
                <button class="btn-res" onclick="addGameRes('삼진')">삼진</button>

                <button class="btn-res hit" onclick="addGameRes('볼넷')">볼넷</button>
                <button class="btn-res hit" onclick="addGameRes('사구')">사구</button>
                <button class="btn-res hit" onclick="addGameRes('안타')">안타</button>

                <button class="btn-res hit" onclick="addGameRes('2루타')">2루타</button>
                <button class="btn-res hit" onclick="addGameRes('3루타')">3루타</button>
                <button class="btn-res hr" onclick="addGameRes('홈런(G)')">홈런(G)</button>

                <button class="btn-res hr" onclick="addGameRes('홈런')">홈런</button>
                <button class="btn-res out-special" onclick="addGameRes('병살')">병살</button>
                <button class="btn-res out-special" onclick="addGameRes('삼중살')">삼중살</button>
            </div>
            <button style="width:100%; background:#FF3B30; border:none; padding:10px; border-radius:5px; margin-top:10px; font-weight:bold; color:white; font-size:13px;" onclick="undoGameRes()">마지막 입력 취소</button>
        </div>

        <div id="defense-controls" style="display:none;">
            <div style="display:flex; gap:10px;">
                <button style="flex:1; background:#444; padding:15px; font-size:20px; border-radius:8px; color:white; border:none; font-weight:bold;" onclick="undoGameRes()">-1구</button>
                <button style="flex:2; background:#32D74B; padding:15px; font-size:20px; border-radius:8px; color:black; font-weight:bold; border:none;" onclick="addGameRes()">+1 투구</button>
            </div>
        </div>
    </div>

    <button onclick="globalReset()" style="width:100%; background:#8B0000; color:white; border:none; padding:15px; border-radius:8px; margin-top:20px; font-weight:bold; font-size:15px; margin-bottom: 20px;">🚨 경기 전면 초기화 (데이터 0으로 리셋)</button>
</div>

<div id="panel-lineup" style="display:none;">
    <div class="card">
        <h3 id="lineup-title" style="margin:0 0 15px 0; color:#FFD700;">라인업 설정</h3>

        <div style="display:flex; gap:5px; margin-bottom:15px; background:#1c1c1e; padding:8px; border-radius:8px;">
            <input type="text" id="new-player-name" placeholder="새로운 선수 이름 입력" style="flex:1; padding:8px; border-radius:5px; border:1px solid #555; background:#2c2c2e; color:white;">
            <button onclick="addNewPlayer()" style="background:#0A84FF; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">추가</button>
        </div>

        <div id="lineup-list"></div>
    </div>
</div>

<script>
    const TARGET_ID = 'jiho-papa-live-viewer';
    let peer = null;
    let conn = null;

    const PLAYER_DB_KEY = 'bb_players_master';
    const DEFAULT_PLAYERS = {
        "새싹": ["최지호", "양현준", "김재윤", "유하진", "홍현서", "손우진", "나라온", "김리호", "나라찬", "이승빈"],
        "꿈나무": ["김영재", "정수안", "이선우", "김태훈", "홍현준", "전준휘", "노윤호", "신선우", "꿈나무9", "최지호", "김재윤", "유하진", "홍현서"],
        "유소년": ["최이안", "김지겸", "이승현", "박건희", "구도영", "이현성", "이준성", "신주호", "오종원"]
    };

    let PLAYERS = JSON.parse(localStorage.getItem(PLAYER_DB_KEY)) || DEFAULT_PLAYERS;
    const POSITIONS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "DH"];

    const dateStr = new Date().toISOString().slice(0, 10);
    const SCORE_KEY = 'bb_score_' + dateStr;
    const LINEUP_KEY = 'bb_lineup_' + dateStr;

    let scoreState = JSON.parse(localStorage.getItem(SCORE_KEY)) || {
        nameA: '빅드림', nameB: '상대팀', scoreA: 0, scoreB: 0, inning: 1, isTop: true,
        base1: false, base2: false, base3: false, b: 0, s: 0, o: 0,
        currentClass: '새싹', gameMode: 'offense'
    };

    let lineupState = JSON.parse(localStorage.getItem(LINEUP_KEY)) || {
        새싹: { activeIdx: 0, list: Array(9).fill(null).map((_, i) => ({ name: PLAYERS["새싹"][i]||'선수', pos: POSITIONS[i]||'DH', results: [] })), pName: PLAYERS["새싹"][0], pCount: 0 },
        꿈나무: { activeIdx: 0, list: Array(9).fill(null).map((_, i) => ({ name: PLAYERS["꿈나무"][i]||'선수', pos: POSITIONS[i]||'DH', results: [] })), pName: PLAYERS["꿈나무"][0], pCount: 0 },
        유소년: { activeIdx: 0, list: Array(9).fill(null).map((_, i) => ({ name: PLAYERS["유소년"][i]||'선수', pos: POSITIONS[i]||'DH', results: [] })), pName: PLAYERS["유소년"][0], pCount: 0 }
    };

    let currentMainTab = 'score';

    function initConn() {
        if (!peer) return;
        if (peer.disconnected) peer.reconnect();
        if (conn) conn.close();
        conn = peer.connect(TARGET_ID);
        conn.on('open', () => {
            document.getElementById('status').innerHTML = "✅ 방송 연결됨 <button onclick='initConn()' style='padding:2px 5px; font-size:10px; background:#444; border:none; color:white; border-radius:4px;'>🔄</button>";
            document.getElementById('status').style.color = "#32D74B";
            syncAll();
        });
        // 🔄 뷰어(방송앱)가 reload 후 재접속하면 "현재 상태 줘"라고 요청 → 즉시 전체 동기화 응답.
        conn.on('data', (d) => {
            if (d && d.req === 'sync') syncAll();
        });
    }

    function setMainTab(tab) {
        currentMainTab = tab;
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.toggle('active', b.id === 'mtab-'+tab));
        document.getElementById('panel-score').style.display = tab === 'score' ? 'block' : 'none';
        document.getElementById('panel-lineup').style.display = tab !== 'score' ? 'block' : 'none';
        if(tab !== 'score') renderLineupSetup(tab);
        else updateScoreUI();
    }

    function addScore(f, v) { scoreState[f] = Math.max(0, scoreState[f] + v); updateScoreState(); }
    function toggleBase(n) { scoreState['base'+n] = !scoreState['base'+n]; updateScoreState(); }

    function addBSO(t) {
        if(t === 'b') {
            scoreState.b++;
            if(scoreState.b > 3) { scoreState.b = 0; scoreState.s = 0; }
        } else if(t === 's') {
            scoreState.s++;
            if(scoreState.s > 2) { scoreState.s = 0; scoreState.b = 0; scoreState.o++; }
        } else if(t === 'o') {
            scoreState.o++; scoreState.b = 0; scoreState.s = 0;
        }
        if(scoreState.o > 2) scoreState.o = 0;
        updateScoreState();
    }

    function resetBS() { scoreState.b = 0; scoreState.s = 0; updateScoreState(); }
    function resetBSO() { scoreState.b = 0; scoreState.s = 0; scoreState.o = 0; updateScoreState(); }

    function changeInning(v) {
        if (v === 1) {
            if (scoreState.isTop) scoreState.isTop = false;
            else { scoreState.isTop = true; scoreState.inning++; }
        } else {
            if (!scoreState.isTop) scoreState.isTop = true;
            else { if (scoreState.inning > 1) { scoreState.isTop = false; scoreState.inning--; } }
        }
        scoreState.base1 = scoreState.base2 = scoreState.base3 = false;
        scoreState.b = scoreState.s = scoreState.o = 0;
        updateScoreState();
    }

    function updateScoreState() {
        scoreState.nameA = document.getElementById('nameA').value;
        scoreState.nameB = document.getElementById('nameB').value;
        localStorage.setItem(SCORE_KEY, JSON.stringify(scoreState));
        updateScoreUI();
        if(conn && conn.open) conn.send(scoreState);
    }

    function updateScoreUI() {
        document.getElementById('nameA').value = scoreState.nameA;
        document.getElementById('nameB').value = scoreState.nameB;
        document.getElementById('disp-scoreA').innerText = scoreState.scoreA;
        document.getElementById('disp-scoreB').innerText = scoreState.scoreB;
        document.getElementById('disp-inning').innerText = scoreState.inning + "회 " + (scoreState.isTop?'초':'말');
        for(let i=1; i<=3; i++) document.getElementById('mbase'+i).classList.toggle('on', scoreState['base'+i]);
        for(let i=1; i<=3; i++) document.getElementById('mb'+i).classList.toggle('on', scoreState.b>=i);
        for(let i=1; i<=2; i++) document.getElementById('ms'+i).classList.toggle('on', scoreState.s>=i);
        for(let i=1; i<=2; i++) document.getElementById('mo'+i).classList.toggle('on', scoreState.o>=i);

        document.querySelectorAll('.class-small-btn').forEach(b => b.classList.toggle('active', b.id === 'cs-'+scoreState.currentClass));
        document.getElementById('gm-off').classList.toggle('active', scoreState.gameMode === 'offense');
        document.getElementById('gm-def').classList.toggle('active', scoreState.gameMode === 'defense');

        document.getElementById('offense-controls').style.display = scoreState.gameMode === 'offense' ? 'block' : 'none';
        document.getElementById('defense-controls').style.display = scoreState.gameMode === 'defense' ? 'block' : 'none';
        document.getElementById('batter-nav-group').style.display = scoreState.gameMode === 'offense' ? 'flex' : 'none';

        const curL = lineupState[scoreState.currentClass];
        const curB = curL.list[curL.activeIdx];
        document.getElementById('live-batter-name').innerText = scoreState.gameMode === 'offense' ? `${curL.activeIdx+1}.${curB.name}(${curB.pos})` : `P.${curL.pName} (${curL.pCount}구)`;
    }

    function changeGameClass(cls) { scoreState.currentClass = cls; updateScoreState(); sendLineupData(); }
    function setGameMode(m) { scoreState.gameMode = m; updateScoreState(); sendLineupData(); }

    function nextBatter() {
        if(scoreState.gameMode === 'offense') {
            lineupState[scoreState.currentClass].activeIdx = (lineupState[scoreState.currentClass].activeIdx + 1) % 9;
        }
        saveLineup(); sendLineupData(); updateScoreUI();
    }

    // 💡 이전 타자 기능 추가
    function prevBatter() {
        if(scoreState.gameMode === 'offense') {
            lineupState[scoreState.currentClass].activeIdx = (lineupState[scoreState.currentClass].activeIdx - 1 + 9) % 9;
        }
        saveLineup(); sendLineupData(); updateScoreUI();
    }

    function addGameRes(r) {
        if(scoreState.gameMode === 'offense') {
            const b = lineupState[scoreState.currentClass].list[lineupState[scoreState.currentClass].activeIdx];
            if(b.results.length < 5) b.results.push(r);
            resetBS(); // 출루/타격 시 카운트 초기화
        } else {
            lineupState[scoreState.currentClass].pCount++;
        }
        saveLineup(); sendLineupData(); updateScoreUI();
    }

    function undoGameRes() {
        if(scoreState.gameMode === 'offense') lineupState[scoreState.currentClass].list[lineupState[scoreState.currentClass].activeIdx].results.pop();
        else lineupState[scoreState.currentClass].pCount = Math.max(0, lineupState[scoreState.currentClass].pCount - 1);
        saveLineup(); sendLineupData(); updateScoreUI();
    }

    function addNewPlayer() {
        const input = document.getElementById('new-player-name');
        const newName = input.value.trim();
        if (!newName) return;
        const currentCls = currentMainTab;
        if (PLAYERS[currentCls].includes(newName)) { alert("이미 명단에 있는 이름입니다!"); return; }
        PLAYERS[currentCls].push(newName);
        localStorage.setItem(PLAYER_DB_KEY, JSON.stringify(PLAYERS));
        input.value = ""; renderLineupSetup(currentCls);
    }

    function renderLineupSetup(cls) {
        document.getElementById('lineup-title').innerText = cls + " 라인업 명단 관리";
        const container = document.getElementById('lineup-list');
        container.innerHTML = "";
        lineupState[cls].list.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = "order-item";
            let pOpt = PLAYERS[cls].map(name => `<option value="${name}" ${p.name===name?'selected':''}>${name}</option>`).join('');
            let posOpt = POSITIONS.map(pos => `<option value="${pos}" ${p.pos===pos?'selected':''}>${pos}</option>`).join('');
            div.innerHTML = `<span style="width:20px; font-weight:bold; color:#0A84FF;">${i+1}</span><select class="player-sel" onchange="editPlayer('${cls}',${i},'name',this.value)">${pOpt}</select><select class="pos-sel" onchange="editPlayer('${cls}',${i},'pos',this.value)">${posOpt}</select>`;
            container.appendChild(div);
        });
        const pdiv = document.createElement('div');
        pdiv.className = "card"; pdiv.style.marginTop = "10px";
        let pListOpt = PLAYERS[cls].map(name => `<option value="${name}" ${lineupState[cls].pName===name?'selected':''}>${name}</option>`).join('');
        pdiv.innerHTML = `<h4 style="margin:0 0 10px 0; color:#ccc;">현재 투수 설정</h4><select class="player-sel" style="width:100%; padding:10px;" onchange="editPitcher('${cls}',this.value)">${pListOpt}</select><br><button onclick="lineupState['${cls}'].pCount=0;saveLineup();updateScoreUI();" style="margin-top:10px; width:100%; padding:10px; background:#444; border:none; color:white; border-radius:5px; font-weight:bold;">이 투수 투구수 초기화</button>`;
        container.appendChild(pdiv);
    }

    function editPlayer(cls, i, field, val) { lineupState[cls].list[i][field] = val; saveLineup(); sendLineupData(); }
    function editPitcher(cls, val) { lineupState[cls].pName = val; saveLineup(); sendLineupData(); }
    function saveLineup() { localStorage.setItem(LINEUP_KEY, JSON.stringify(lineupState)); }

    function globalReset() {
        if(!confirm("⚠️주의⚠️\n현재 점수, 볼카운트, 투구수, 타자 기록 등 모든 데이터가 0으로 초기화됩니다.\n새로운 경기를 시작하시겠습니까?")) return;
        scoreState.scoreA = 0; scoreState.scoreB = 0;
        scoreState.inning = 1; scoreState.isTop = true;
        scoreState.base1 = scoreState.base2 = scoreState.base3 = false;
        scoreState.b = 0; scoreState.s = 0; scoreState.o = 0;
        ["새싹", "꿈나무", "유소년"].forEach(cls => {
            lineupState[cls].activeIdx = 0; lineupState[cls].pCount = 0;
            lineupState[cls].list.forEach(b => b.results = []);
        });
        updateScoreState(); saveLineup(); sendLineupData();
        alert("기록이 초기화되었습니다.");
    }

    function sendLineupData() {
        if(!conn || !conn.open) return;
        const curL = lineupState[scoreState.currentClass];
        let html = "";
        if(scoreState.gameMode === 'offense') {
            const b = curL.list[curL.activeIdx];
            html = `<div style="display:flex; justify-content:space-between; width:100%;"><span>${curL.activeIdx+1}.${b.name}(${b.pos})</span><span style="color:#FFD700;">${b.results.join(' &nbsp; ')}</span></div>`;
        } else {
            html = `<div style="display:flex; justify-content:space-between; width:100%;"><span>P. ${curL.pName}</span><span>⚾️ ${curL.pCount}</span></div>`;
        }
        conn.send({ html });
    }

    function syncAll() { updateScoreState(); sendLineupData(); }

    // ── 🔒 접속 암호 게이트 + 컨트롤러 시작 ─────────────────────────────────────────
    function todayCode() {
        const d = new Date();
        return String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    }

    function startController() {
        peer = new Peer();
        peer.on('open', initConn);
        // 끊김 감지 재접속(2초 주기) — viewer reload 후 빠르게 복구.
        setInterval(() => { if(!conn || !conn.open) initConn(); }, 2000);
        // 상태 하트비트(5초) — 패킷 누락/재접속 직후에도 최신 상태가 곧 반영되도록 안전망.
        setInterval(() => { if(conn && conn.open) { conn.send(scoreState); sendLineupData(); } }, 5000);
        setMainTab('score');
    }

    function submitGate() {
        const v = (document.getElementById('gate-input').value || '').trim();
        if (v === todayCode()) {
            sessionStorage.setItem('ctrl_auth', todayCode());
            document.getElementById('gate').style.display = 'none';
            startController();
        } else {
            document.getElementById('gate-err').style.display = 'block';
            document.getElementById('gate-input').value = '';
        }
    }

    // 같은 탭에서 이미 인증했으면(새로고침 등) 다시 묻지 않음. 새 방문자/새 탭은 매번 입력.
    if (sessionStorage.getItem('ctrl_auth') === todayCode()) {
        document.getElementById('gate').style.display = 'none';
        startController();
    } else {
        setTimeout(() => document.getElementById('gate-input').focus(), 100);
    }
</script>
</body>
</html>
