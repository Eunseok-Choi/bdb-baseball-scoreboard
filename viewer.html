<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빅드림 통합 스코어 보드 뷰어</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --scale-factor: 0.55; }
        body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        .master-container {
            width: 360px; margin: 10px; display: flex; flex-direction: column; gap: 8px;
            transform: scale(var(--scale-factor)); transform-origin: top left;
        }
        .scoreboard { background: rgba(0, 0, 0, 0.92); padding: 12px; border: 1px solid #444; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
        .score-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .team-box { flex: 1.2; text-align: center; font-size: 20px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .score-box { flex: 1.6; text-align: center; font-size: 28px; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 4px black; letter-spacing: -1px; }
        .info-row { display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
        .bases-container { width: 80px; height: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .base { width: 16px; height: 16px; border: 3.5px solid #666; transform: rotate(45deg); transition: background-color 0.2s, border-color 0.2s; background-color: transparent; }
        .base.on { background-color: #FFD600; border-color: #FFD600; box-shadow: 0 0 6px #FFD600; }
        .base-row-mid { display: flex; gap: 18px; margin-top: -3px; }
        .bso-container { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; padding-left: 25px; }
        .count-row { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; }
        .bso-label { display: inline-block; width: 14px; text-align: left; }
        .dot { width: 17px; height: 17px; border-radius: 50%; background: #333; border: 1.5px solid #555; }
        .dot.B.on { background: #00FF41; border-color: #00FF41; box-shadow: 0 0 8px #00FF41; }
        .dot.S.on { background: #FFEB3B; border-color: #FFEB3B; box-shadow: 0 0 8px #FFEB3B; }
        .dot.O.on { background: #FF3B30; border-color: #FF3B30; box-shadow: 0 0 8px #FF3B30; }
        .inning-box { width: 60px; text-align: center; display: flex; flex-direction: column; align-items: center; font-size: 20px; font-weight: 800; }
        .triangle { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; margin-top: 4px; }
        .triangle.up { border-bottom: 18px solid #FF3B30; }
        .triangle.down { border-top: 18px solid #FF3B30; }
        .lineup-bar { background: rgba(30, 30, 30, 0.95); padding: 10px 15px; border: 1px solid #444; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); font-size: 17px; font-weight: 800; min-height: 38px; display: flex; align-items: center; width: 100%; box-sizing: border-box; }
        #lineup-text { width: 100%; color: #eee; letter-spacing: -0.2px; white-space: pre-wrap; line-height: 1.3; }
    </style>
</head>
<body>
<div class="master-container">
    <div class="scoreboard">
        <div class="score-row">
            <div class="team-box" id="name-a">빅드림</div>
            <div class="score-box"><span id="score-a">0</span> : <span id="score-b">0</span></div>
            <div class="team-box" id="name-b">상대팀</div>
        </div>
        <div class="info-row">
            <div class="bases-container"><div id="base2" class="base"></div><div class="base-row-mid"><div id="base3" class="base"></div><div id="base1" class="base"></div></div></div>
            <div class="bso-container">
                <div class="count-row"><span class="bso-label">B</span> <div id="b1" class="dot B"></div> <div id="b2" class="dot B"></div> <div id="b3" class="dot B"></div></div>
                <div class="count-row"><span class="bso-label">S</span> <div id="s1" class="dot S"></div> <div id="s2" class="dot S"></div></div>
                <div class="count-row"><span class="bso-label">O</span> <div id="o1" class="dot O"></div> <div id="o2" class="dot O"></div></div>
            </div>
            <div class="inning-box"><span id="inning-num">1</span><div id="inning-tri" class="triangle up"></div></div>
        </div>
    </div>
    <div class="lineup-bar"><div id="lineup-text">준비 중...</div></div>
</div>

<script>
    const MY_ID = 'jiho-papa-live-viewer';
    const LS_KEY = 'bdb_scoreboard_state';   // 방송앱 30분 리로드에도 점수 유지용
    let peer = null;

    // ── 로컬 상태 (앱 리모컨 제어 + 컨트롤러 수신 공통 소스) ──────────────
    const defaultState = {
        nameA: '빅드림', nameB: '상대팀', scoreA: 0, scoreB: 0,
        inning: 1, isTop: true,
        base1: false, base2: false, base3: false,
        b: 0, s: 0, o: 0, lineupHtml: '준비 중...'
    };
    function loadState() {
        try { const j = localStorage.getItem(LS_KEY); if (j) return Object.assign({}, defaultState, JSON.parse(j)); }
        catch (e) {}
        return Object.assign({}, defaultState);
    }
    function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
    let state = loadState();

    function render() {
        document.getElementById('name-a').innerText = state.nameA;
        document.getElementById('name-b').innerText = state.nameB;
        document.getElementById('score-a').innerText = state.scoreA;
        document.getElementById('score-b').innerText = state.scoreB;
        document.getElementById('inning-num').innerText = state.inning;
        document.getElementById('inning-tri').className = state.isTop ? 'triangle up' : 'triangle down';
        document.getElementById('base1').classList.toggle('on', !!state.base1);
        document.getElementById('base2').classList.toggle('on', !!state.base2);
        document.getElementById('base3').classList.toggle('on', !!state.base3);
        for (let i = 1; i <= 3; i++) document.getElementById('b' + i)?.classList.toggle('on', state.b >= i);
        for (let i = 1; i <= 2; i++) document.getElementById('s' + i)?.classList.toggle('on', state.s >= i);
        for (let i = 1; i <= 2; i++) document.getElementById('o' + i)?.classList.toggle('on', state.o >= i);
        document.getElementById('lineup-text').innerHTML = state.lineupHtml;
    }

    function escapeHtml(t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 컨트롤러(PeerJS)에서 받은 델타를 state에 병합 후 렌더 → 컨트롤러/앱 제어가 같은 상태를 공유.
    function applyData(data) {
        if (data.html !== undefined) state.lineupHtml = data.html;
        else if (data.text !== undefined) state.lineupHtml = escapeHtml(data.text);
        if (data.nameA !== undefined) state.nameA = data.nameA;
        if (data.nameB !== undefined) state.nameB = data.nameB;
        if (data.scoreA !== undefined) state.scoreA = data.scoreA;
        if (data.scoreB !== undefined) state.scoreB = data.scoreB;
        if (data.inning !== undefined) state.inning = data.inning;
        if (data.isTop !== undefined) state.isTop = data.isTop;
        if (data.base1 !== undefined) state.base1 = data.base1;
        if (data.base2 !== undefined) state.base2 = data.base2;
        if (data.base3 !== undefined) state.base3 = data.base3;
        if (data.b !== undefined) state.b = data.b;
        if (data.s !== undefined) state.s = data.s;
        if (data.o !== undefined) state.o = data.o;
        saveState();
        render();
    }

    // ── 방송앱 리모컨 제어 API (앱이 evaluateJavascript로 호출) ──────────────
    // 카운트는 표시 점수 수만큼 순환(다시 누르면 0으로 리셋). 야구 자동 진행 로직은 넣지 않음(수동 제어).
    function bdbToggleBase(n) { state['base' + n] = !state['base' + n]; saveState(); render(); }
    function bdbBall()   { state.b = (state.b + 1) % 4; saveState(); render(); }   // 0→1→2→3→0
    function bdbStrike() { state.s = (state.s + 1) % 3; saveState(); render(); }   // 0→1→2→0
    function bdbOut()    { state.o = (state.o + 1) % 3; saveState(); render(); }   // 0→1→2→0
    function bdbSwapTeams() {   // 팀 이름 + 점수 함께 교체(각 팀이 자기 점수 유지)
        const n = state.nameA; state.nameA = state.nameB; state.nameB = n;
        const sc = state.scoreA; state.scoreA = state.scoreB; state.scoreB = sc;
        saveState(); render();
    }
    function bdbScore(team, delta) {
        if (team === 'a') state.scoreA = Math.max(0, state.scoreA + delta);
        else state.scoreB = Math.max(0, state.scoreB + delta);
        saveState(); render();
    }
    // 기록 초기화 — 점수/카운트/베이스/이닝을 기본값으로(이름은 유지할지 여부 선택). 새 경기 시작용.
    function bdbReset(keepNames) {
        const a = state.nameA, b = state.nameB;
        state = Object.assign({}, defaultState);
        if (keepNames) { state.nameA = a; state.nameB = b; }
        saveState(); render();
    }
    // 팀 이름 설정(빈 값/undefined는 변경 안 함).
    function bdbSetNames(a, b) {
        if (a !== undefined && a !== null && a !== '') state.nameA = a;
        if (b !== undefined && b !== null && b !== '') state.nameB = b;
        saveState(); render();
    }
    // 이닝 이동(+1 다음 / -1 이전, 최소 1회).
    function bdbInning(delta) { state.inning = Math.max(1, (state.inning | 0) + delta); saveState(); render(); }
    // 초/말 전환(삼각형 ▲/▼).
    function bdbToggleTop() { state.isTop = !state.isTop; saveState(); render(); }
    // 라인업 바 텍스트 설정(앱 리모컨 모드에서 '라인업 미지원.' 등 표시용).
    function bdbSetLineup(t) { state.lineupHtml = escapeHtml(t); saveState(); render(); }
    // window 전역으로 노출(evaluateJavascript에서 호출 가능하도록 명시)
    window.bdbToggleBase = bdbToggleBase; window.bdbBall = bdbBall;
    window.bdbStrike = bdbStrike; window.bdbOut = bdbOut;
    window.bdbSwapTeams = bdbSwapTeams; window.bdbScore = bdbScore;
    window.bdbReset = bdbReset; window.bdbSetNames = bdbSetNames;
    window.bdbInning = bdbInning; window.bdbToggleTop = bdbToggleTop;
    window.bdbSetLineup = bdbSetLineup;
    window.applyData = applyData;   // 앱 내장 컨트롤러(controller_single.html) 브릿지가 전체 상태를 전달할 때 사용

    // 최초 1회 저장된(또는 기본) 상태 렌더
    render();

    // 🛡️ 뷰어 연결 및 자동 복구 시스템 (컨트롤러를 별도로 쓸 때 여전히 동작)
    function initViewerPeer() {
        if (peer && !peer.destroyed) { peer.destroy(); }
        peer = new Peer(MY_ID);
        peer.on('open', (id) => { console.log('✅ 뷰어 방 생성 완료:', id); });
        peer.on('connection', (conn) => {
            conn.on('open', () => { try { conn.send({ req: 'sync' }); } catch (e) {} });
            conn.on('data', (data) => {
                if (data && data.req !== undefined) return;   // 제어용 요청 메시지는 무시
                applyData(data);
            });
        });
        peer.on('disconnected', () => { peer.reconnect(); });
        peer.on('error', (err) => { console.error('❌ Peer 에러, 3초 후 재초기화:', err); setTimeout(initViewerPeer, 3000); });
    }
    initViewerPeer();

    // 🕵️ 좀비 와치독 (5초마다 생존 확인)
    setInterval(() => {
        if (!peer || peer.disconnected || peer.destroyed) {
            if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
            else initViewerPeer();
        }
    }, 5000);
</script>
</body>
</html>
