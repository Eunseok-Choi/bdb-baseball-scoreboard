<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라인업 설정/리모컨</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #121212; color: white; margin: 0; padding: 10px; touch-action: manipulation; }
        #status { text-align: center; font-size: 13px; font-weight: bold; color: #FF453A; margin-bottom: 10px; padding: 6px; background: #222; border-radius: 8px; }
        .card { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        
        /* 클래스 탭 스타일 */
        .class-tab-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .class-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border: 1px solid #444; border-radius: 8px; cursor: pointer; color: #ccc; background: #222; }
        .class-btn.active { background: #FFD700; color: black; border-color: #FFD700; }

        /* 공수 탭 스타일 */
        .tab-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background: #444; }
        .tab-btn.active.offense { background: #0A84FF; }
        .tab-btn.active.defense { background: #FF453A; }
        
        .order-list { display: flex; flex-direction: column; gap: 6px; }
        .order-item { display: flex; align-items: center; gap: 5px; background: #3a3a3c; padding: 6px; border-radius: 8px; border: 2px solid transparent; }
        .order-item.active { border-color: #0A84FF; background: #1c1c1e; }
        .order-num { width: 20px; font-weight: bold; color: #0A84FF; font-size: 16px; text-align: center; }
        .player-sel { flex: 3; background: #1c1c1e; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 14px; width: 0; }
        .pos-sel { flex: 1.5; background: #222; color: #FFD700; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-set-active { flex: 1.5; background: #444; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .order-item.active .btn-set-active { background: #0A84FF; }
        
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        button { font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; padding: 10px; }
        .btn-res { background: #444; font-size: 13px; }
        .btn-res.hit { background: #32D74B; color: black; }
        .btn-res.hr { background: #FFD60A; color: black; }
        .current-batter-info { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #0A84FF; }
        .result-text { font-size: 18px; color: #FFD700; font-weight: bold; }
        .pitch-display { text-align: center; font-size: 32px; font-weight: 900; margin: 15px 0; }
        .btn-p { flex: 1; padding: 15px; font-size: 20px; }
    </style>
</head>
<body>

<div id="status">📡 라인업 연결 시도 중...</div>

<!-- 클래스 탭 -->
<div class="class-tab-container">
    <button id="tab-cls-새싹" class="class-btn" onclick="setClass('새싹')">🌱 새싹</button>
    <button id="tab-cls-꿈나무" class="class-btn" onclick="setClass('꿈나무')">🌿 꿈나무</button>
    <button id="tab-cls-유소년" class="class-btn" onclick="setClass('유소년')">⚾ 유소년</button>
</div>

<!-- 공/수 탭 -->
<div class="tab-container">
    <button id="tab-offense" class="tab-btn active offense" onclick="setMode('offense')">공격 (타자)</button>
    <button id="tab-defense" class="tab-btn" onclick="setMode('defense')">수비 (투수)</button>
</div>

<!-- 공격 패널 -->
<div id="panel-offense">
    <div class="card" style="padding: 10px;">
        <h4 style="margin: 0 0 8px 0; font-size: 13px; color: #aaa;">라인업 및 포지션 설정</h4>
        <div class="order-list" id="order-list-container"></div>
    </div>
    <div class="card">
        <div class="current-batter-info">
            <div id="active-info" style="font-size:13px; color:#aaa; margin-bottom:4px;">1번 타석 입장</div>
            <div class="result-text" id="disp-results">결과 없음</div>
        </div>
        <div class="result-grid">
            <button class="btn-res" onclick="addRes('뜬공')">뜬공</button><button class="btn-res" onclick="addRes('땅볼')">땅볼</button><button class="btn-res" onclick="addRes('삼진')">삼진</button><button class="btn-res hit" onclick="addRes('볼넷')">볼넷</button>
            <button class="btn-res hit" onclick="addRes('안타')">안타</button><button class="btn-res hit" onclick="addRes('2루타')">2루타</button><button class="btn-res hit" onclick="addRes('3루타')">3루타</button><button class="btn-res hr" onclick="addRes('홈런')">홈런</button>
        </div>
        <div style="display: flex; gap: 5px; margin-top: 8px;">
            <input type="text" id="manual-in" placeholder="직접입력" style="flex:2; padding:8px; border-radius:5px; border:none; background:#111; color:white;">
            <button style="flex:1; background:#0A84FF;" onclick="addManual()">추가</button><button style="background:#FF453A; padding:0 10px;" onclick="undo()">취소</button>
        </div>
    </div>
</div>

<!-- 수비 패널 -->
<div id="panel-defense" style="display: none;">
    <div class="card">
        <h4 style="margin:0 0 10px 0;">투수 선택</h4>
        <select id="sel-pitcher" style="width:100%; padding:10px; background:#111; color:white; border-radius:8px; border:1px solid #555;" onchange="changePitcher()"></select>
        <div class="pitch-display">⚾ <span id="disp-p-count" style="color:#FFD60A;">0</span></div>
        <div style="display:flex; gap:10px;"><button class="btn-p" style="background:#444;" onclick="changeP(-1)">-1</button><button class="btn-p" style="background:#32D74B; color:black;" onclick="changeP(1)">+1구</button></div>
        <button style="width:100%; margin-top:10px; background:#222; font-size:12px;" onclick="resetP()">투구수 초기화</button>
    </div>
</div>

<script>
    const TARGET_ID = 'jiho-papa-live-viewer'; 
    const peer = new Peer();
    let conn;

    // ★ 각 클래스별 선수 명단
    const PLAYERS = {
        "새싹": ["최지호", "양현준", "김재윤", "유하진", "홍현서", "손우진", "나라온", "김리호", "나라찬", "이승빈", "김재호"],
        "꿈나무": ["김영재", "정수안", "이선우", "김태훈", "홍현준", "전준휘", "노윤호", "신선우", "꿈나무9", "최지호", "김재윤", "유하진", "홍현서"],
        "유소년": ["최이안", "김지겸", "이승현", "박건희", "구도영", "이현성", "이준성", "신주호", "오종원"]
    };
    
    const POSITIONS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "DH"];
    const CLASSES = ["새싹", "꿈나무", "유소년"];

    // ==========================================
    // 📅 오늘 날짜를 구해서 저장소(DB) 키 이름으로 사용
    // ==========================================
    const today = new Date();
    // 2026-05-04 형식으로 생성
    const dateString = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    // 날짜가 포함된 고유 저장 키 (내일 접속하면 이름이 바뀌어서 캐시가 완전 초기화됨)
    const STORAGE_KEY = 'baseball_lineup_' + dateString;

    // 오늘 날짜의 데이터 복구 시도
    let savedState = JSON.parse(localStorage.getItem(STORAGE_KEY));
    let state;

    if (savedState && savedState.lineups) {
        state = savedState;
    } else {
        // 완전 초기화 (새로운 날짜에 접속하거나 데이터가 없으면 무조건 '새싹'으로 세팅됨)
        state = { mode: 'offense', currentClass: '새싹', activeIdx: 0, lineups: {}, pitchers: {} };
        CLASSES.forEach(cls => {
            state.lineups[cls] = Array(9).fill(null).map((_, i) => ({ name: PLAYERS[cls][i] || '선수', pos: POSITIONS[i] || 'DH', results: [] }));
            state.pitchers[cls] = { name: PLAYERS[cls][0] || '선수', count: 0 };
        });
    }

    function updateStatus(msg, color) {
        const st = document.getElementById('status');
        st.innerHTML = msg; st.style.color = color;
    }

    function initConnection() {
        if (peer.disconnected) peer.reconnect();
        if (conn) conn.close();
        conn = peer.connect(TARGET_ID);
        conn.on('open', () => {
            updateStatus("✅ 연결됨 <button onclick='initConnection()' style='background:#444; border:none; color:white; padding:2px 8px; margin-left:5px;'>🔄</button>", "#32D74B");
            send();
        });
    }

    peer.on('open', initConnection);
    setInterval(() => { if (!conn || !conn.open) initConnection(); }, 4000);

    // 클래스 변경 함수
    function setClass(cls) {
        state.currentClass = cls;
        state.activeIdx = 0; // 타석 1번으로 초기화
        updateUI();
        send();
    }

    function renderLineupSlots() {
        const container = document.getElementById('order-list-container');
        container.innerHTML = '';
        
        const currentLineup = state.lineups[state.currentClass];
        const currentPlayers = PLAYERS[state.currentClass];

        currentLineup.forEach((batter, i) => {
            const item = document.createElement('div');
            item.className = `order-item ${state.activeIdx === i ? 'active' : ''}`;
            
            let pOptions = currentPlayers.map(p => `<option value="${p}" ${p === batter.name ? 'selected' : ''}>${p}</option>`).join('');
            let posOptions = POSITIONS.map(pos => `<option value="${pos}" ${pos === batter.pos ? 'selected' : ''}>${pos}</option>`).join('');
            
            item.innerHTML = `<div class="order-num">${i + 1}</div>
                <select class="player-sel" onchange="updatePlayerName(${i}, this.value)">${pOptions}</select>
                <select class="pos-sel" onchange="updatePlayerPos(${i}, this.value)">${posOptions}</select>
                <button class="btn-set-active" onclick="setActiveBatter(${i})">${state.activeIdx === i ? '타석' : '선택'}</button>`;
            container.appendChild(item);
        });

        const pitcher = state.pitchers[state.currentClass];
        document.getElementById('sel-pitcher').innerHTML = currentPlayers.map(p => `<option value="${p}" ${p===pitcher.name?'selected':''}>${p}</option>`).join('');
    }

    function setMode(m) { state.mode = m; updateUI(); send(); }
    function setActiveBatter(idx) { state.activeIdx = idx; updateUI(); send(); }
    function updatePlayerName(idx, name) { state.lineups[state.currentClass][idx].name = name; save(); send(); }
    function updatePlayerPos(idx, pos) { state.lineups[state.currentClass][idx].pos = pos; save(); send(); }
    
    function addRes(r) { 
        let batter = state.lineups[state.currentClass][state.activeIdx];
        if(batter.results.length >= 5) return; 
        batter.results.push(r); 
        updateUI(); send(); 
    }
    
    function addManual() { const v = document.getElementById('manual-in').value; if(v){ addRes(v); document.getElementById('manual-in').value = ''; } }
    
    function undo() { 
        state.lineups[state.currentClass][state.activeIdx].results.pop(); 
        updateUI(); send(); 
    }
    
    function changeP(v) { 
        let p = state.pitchers[state.currentClass];
        p.count = Math.max(0, p.count + v); 
        updateUI(); send(); 
    }
    
    function resetP() { state.pitchers[state.currentClass].count = 0; updateUI(); send(); }
    function changePitcher() { state.pitchers[state.currentClass].name = document.getElementById('sel-pitcher').value; save(); send(); }

    // 📅 매 변경사항마다 오늘 날짜 키에 저장
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function updateUI() {
        save();
        renderLineupSlots();
        
        // 탭 상태 업데이트
        CLASSES.forEach(cls => {
            document.getElementById(`tab-cls-${cls}`).className = "class-btn" + (state.currentClass === cls ? " active" : "");
        });
        document.getElementById('tab-offense').className = "tab-btn" + (state.mode === 'offense' ? " active offense" : "");
        document.getElementById('tab-defense').className = "tab-btn" + (state.mode === 'defense' ? " active defense" : "");
        
        document.getElementById('panel-offense').style.display = state.mode === 'offense' ? 'block' : 'none';
        document.getElementById('panel-defense').style.display = state.mode === 'defense' ? 'block' : 'none';
        
        const b = state.lineups[state.currentClass][state.activeIdx];
        const p = state.pitchers[state.currentClass];
        
        document.getElementById('active-info').innerText = `${state.currentClass} - ${state.activeIdx + 1}번 타석 입장 (${b.pos})`;
        document.getElementById('disp-results').innerText = b.results.length > 0 ? b.results.join(' / ') : '결과 없음';
        document.getElementById('disp-p-count').innerText = p.count;
    }

    function send() {
        if (!conn || !conn.open) return;
        let html = "";
        const cClass = state.currentClass;
        
        if (state.mode === 'offense') {
            const b = state.lineups[cClass][state.activeIdx];
            const res = b.results.join(' &nbsp; ');
            html = `<div style="display:flex; justify-content:space-between; width:100%;"><span>${state.activeIdx+1}.${b.name}(${b.pos})</span><span style="color:#FFD700;">${res}</span></div>`;
        } else {
            const p = state.pitchers[cClass];
            html = `<div style="display:flex; justify-content:space-between; width:100%;"><span>P. ${p.name}</span><span>⚾️ ${p.count}</span></div>`;
        }
        conn.send({ html });
    }

    updateUI();
</script>
</body>
</html>
