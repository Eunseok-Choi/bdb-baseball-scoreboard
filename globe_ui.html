<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe Content UI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:#06080f; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; user-select:none; }
#app { width:100%; height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#stars { position:absolute; inset:0; pointer-events:none; }
canvas#gc { display:block; cursor:grab; }
canvas#gc.grabbing { cursor:grabbing; }
#ov { position:absolute; left:0; top:0; pointer-events:none; z-index:15; }
#hint-bar { position:absolute; top:20px; left:50%; transform:translateX(-50%); display:flex; gap:24px; z-index:10; }
.hint { font-size:12px; color:rgba(255,255,255,0.3); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.hdot { width:7px; height:7px; border-radius:50%; }
#toast { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:rgba(108,99,255,0.92); color:#fff; font-size:13px; padding:8px 22px; border-radius:24px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:50; white-space:nowrap; }
#toast.show { opacity:1; }
#detail { position:absolute; right:32px; top:50%; transform:translateY(-50%); width:220px; background:rgba(8,8,20,0.97); border:0.5px solid rgba(255,255,255,0.1); border-radius:16px; padding:18px; z-index:30; opacity:0; pointer-events:none; transition:opacity 0.25s; }
#detail.show { opacity:1; pointer-events:auto; }
#d-thumb { width:100%; height:110px; border-radius:10px; margin-bottom:12px; display:block; }
#d-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:3px; line-height:1.4; }
#d-sub { font-size:11px; color:rgba(255,255,255,0.38); margin-bottom:8px; }
#d-tag { display:inline-block; font-size:10px; padding:3px 10px; border-radius:12px; margin-bottom:8px; background:rgba(108,99,255,0.22); color:#9B94FF; }
#d-meta { font-size:11px; color:rgba(255,255,255,0.3); margin-bottom:12px; line-height:1.7; }
#d-play { width:100%; background:rgba(108,99,255,0.85); border:none; border-radius:10px; padding:10px; color:#fff; font-size:13px; cursor:pointer; font-family:inherit; transition:background 0.15s; }
#d-play:hover { background:#6c63ff; }
#d-close { position:absolute; top:12px; right:14px; background:transparent; border:none; color:rgba(255,255,255,0.3); font-size:20px; cursor:pointer; }
#fs-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  will-change: transform, opacity;
}
#fs-canvas { display:block; width:100%; height:100%; }
#fs-close-btn {
  position: absolute;
  top: 24px; right: 28px;
  background: rgba(255,255,255,0.12);
  border: 0.5px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  width: 44px; height: 44px;
  color: #fff; font-size: 22px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
#fs-close-btn:hover { background: rgba(255,255,255,0.25); }
#prompt-bar { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); width:min(600px,calc(100% - 64px)); display:flex; gap:10px; z-index:20; }
#prompt-input { flex:1; background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.15); border-radius:28px; padding:13px 22px; color:#fff; font-size:14px; outline:none; font-family:inherit; transition:border-color 0.2s; }
#prompt-input::placeholder { color:rgba(255,255,255,0.28); }
#prompt-input:focus { border-color:rgba(108,99,255,0.6); }
#prompt-btn { background:rgba(108,99,255,0.85); border:none; border-radius:28px; padding:13px 24px; color:#fff; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap; font-family:inherit; }
#prompt-btn:hover { background:#6c63ff; }
#quick-btns { position:absolute; bottom:76px; left:50%; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; z-index:10; max-width:640px; }

<script>
// ── Stars ──────────────────────────────────────────────────────────────
(function(){
  const svg=document.getElementById('stars'); let h='';
  for(let i=0;i<200;i++){
    h+=`<circle cx="${(Math.random()*100).toFixed(1)}%" cy="${(Math.random()*100).toFixed(1)}%" r="${(Math.random()*1.4+0.2).toFixed(1)}" fill="white" opacity="${(Math.random()*0.5+0.05).toFixed(2)}"/>`;
  }
  svg.innerHTML=h;
})();

// ── Canvas setup ───────────────────────────────────────────────────────
const canvas=document.getElementById('gc');
const ov=document.getElementById('ov');
const ctx=canvas.getContext('2d');
const octx=ov.getContext('2d');
let W,H,CX,CY,R;

// ── Natural Earth — D3 + TopoJSON 지도 렌더 ──────────────────────────
// world-atlas countries-110m (저해상도, 약 110m/px) + land 경계
// 브라우저가 CDN에서 직접 로드 → API 키 불필요
let geoLand     = null;  // 육지 MultiPolygon GeoJSON
let geoBorders  = null;  // 국경선 MultiLineString GeoJSON
let geoLoaded   = false;
let geoLoading  = false;

const TOPO_URL  = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
const D3_URL    = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';
const TOPO_LIB  = 'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js';

// D3 + TopoJSON 동적 로드 후 지리 데이터 fetch
function loadGeoData(){
  if(geoLoading||geoLoaded) return;
  geoLoading=true;

  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

  Promise.all([loadScript(D3_URL), loadScript(TOPO_LIB)])
    .then(()=>fetch(TOPO_URL))
    .then(r=>r.json())
    .then(topo=>{
      // TopoJSON → GeoJSON 변환
      geoLand    = topojson.feature(topo, topo.objects.land);
      geoBorders = topojson.mesh(topo, topo.objects.countries, (a,b)=>a!==b);
      geoLoaded  = true;
      geoLoading = false;
      console.log('[Globe] Natural Earth 지도 데이터 로드 완료');
    })
    .catch(e=>{
      geoLoading=false;
      console.warn('[Globe] 지도 로드 실패, 폴리곤 폴백 사용:', e.message);
    });
}
loadGeoData();

// ── 구면 투영: GeoJSON → Canvas ───────────────────────────────────────
// GeoJSON coordinates [lon,lat] 배열을 구면 3D 투영해서 ctx에 path 그리기
function projectRing(coords){
  let started=false, jumped=false;
  let prevZ=0;
  for(const [lon,lat] of coords){
    const p=rot3d(ll2xyz(lat,lon),rotX,rotY);
    // 뒷면(z<0) → 앞면 경계에서 줄을 끊어 아티팩트 방지
    if(p.z<0.0){ started=false; prevZ=p.z; continue; }
    const sx=CX+p.x*R, sy=CY-p.y*R;
    if(!started||prevZ<0){ ctx.moveTo(sx,sy); started=true; }
    else ctx.lineTo(sx,sy);
    prevZ=p.z;
  }
}

function drawGeoRings(rings){
  for(const ring of rings) projectRing(ring);
}

// GeoJSON Polygon / MultiPolygon → canvas path
function drawFeatureFill(feature){
  ctx.beginPath();
  const geom=feature.geometry;
  if(!geom) return;
  if(geom.type==='Polygon'){
    for(const ring of geom.coordinates) projectRing(ring);
  } else if(geom.type==='MultiPolygon'){
    for(const poly of geom.coordinates)
      for(const ring of poly) projectRing(ring);
  }
  ctx.fill();
}

// GeoJSON MultiLineString → canvas stroke (국경선)
function drawBorders(geom){
  if(!geom) return;
  ctx.beginPath();
  if(geom.type==='LineString'){
    projectRing(geom.coordinates);
  } else if(geom.type==='MultiLineString'){
    for(const line of geom.coordinates) projectRing(line);
  }
  ctx.stroke();
}

// 메인 지도 렌더 함수
function drawNaturalEarth(){
  if(!geoLoaded) return false;

  // 육지 채우기
  ctx.fillStyle='#2d5a3a';
  if(geoLand.type==='FeatureCollection'){
    for(const f of geoLand.features) drawFeatureFill(f);
  } else {
    // land object는 단일 Feature(MultiPolygon)
    drawFeatureFill(geoLand);
  }

  // 국경선
  ctx.strokeStyle='rgba(120,200,140,0.25)';
  ctx.lineWidth=0.5;
  drawBorders(geoBorders);

  return true;
}

// ── 폴백: 간략화 폴리곤 (D3 로드 전) ────────────────────────────────
const LAND=[

  [[-10,36],[0,36],[5,43],[10,44],[12,46],[15,45],[18,42],[20,40],[22,40],[25,41],[27,41],[28,42],[30,43],[28,45],[25,48],[22,50],[18,54],[15,58],[12,58],[8,58],[5,57],[2,57],[0,51],[-2,52],[-4,52],[-5,50],[-7,48],[-10,44],[-10,36]],
  [[5,57],[6,58],[8,58],[10,58],[12,58],[14,56],[18,58],[20,60],[22,62],[24,65],[26,68],[28,70],[28,72],[25,72],[22,70],[20,70],[16,68],[14,66],[12,64],[10,62],[8,60],[6,58],[5,57]],

  [[26,42],[28,42],[30,43],[32,46],[35,47],[38,44],[42,42],[45,43],[50,45],[55,43],[60,44],[65,42],[70,42],[74,37],[76,35],[80,33],[85,28],[88,27],[90,25],[94,22],[98,20],[100,20],[104,15],[108,12],[110,10],[114,8],[116,5],[120,2],[122,4],[124,5],[128,4],[130,0],[130,4],[134,10],[140,15],[144,20],[146,40],[142,46],[138,50],[134,52],[130,56],[125,55],[120,55],[115,53],[110,53],[105,52],[100,50],[96,52],[90,52],[85,50],[80,52],[76,56],[70,55],[65,52],[60,55],[56,55],[52,55],[48,52],[44,52],[40,47],[36,47],[32,46],[28,42],[26,42]],
  [[62,22],[66,23],[70,22],[72,20],[74,15],[76,10],[78,8],[80,10],[82,14],[80,18],[78,22],[76,24],[74,28],[72,28],[70,25],[66,23],[62,22]],
  [[100,20],[104,15],[108,12],[110,10],[112,4],[114,2],[116,2],[118,2],[120,2],[116,5],[110,10],[108,12],[104,15],[100,20]],
  [[130,31],[132,33],[133,35],[135,36],[136,36],[138,37],[139,38],[140,40],[141,41],[141,42],[140,43],[137,43],[134,40],[131,36],[130,33],[130,31]],
  [[-5,50],[-3,50],[-1,51],[0,51],[1,52],[0,53],[-2,54],[-3,55],[-5,56],[-6,58],[-4,58],[-3,57],[-2,55],[-3,54],[-4,52],[-5,50]],
  [[-6,52],[-8,52],[-10,54],[-8,56],[-6,54],[-6,52]],
  [[114,-22],[118,-20],[122,-18],[127,-14],[132,-12],[136,-12],[140,-14],[142,-18],[145,-20],[148,-22],[152,-25],[154,-28],[152,-33],[148,-37],[144,-38],[140,-36],[136,-35],[132,-34],[128,-34],[124,-34],[120,-34],[116,-35],[114,-34],[113,-28],[114,-22]],
  [[172,-34],[174,-36],[176,-37],[178,-38],[176,-40],[174,-41],[172,-42],[170,-44],[168,-46],[170,-46],[172,-46],[172,-44],[174,-41],[176,-40],[178,-38],[176,-37],[174,-36],[172,-34]],
  [[-50,83],[-35,83],[-20,76],[-20,70],[-25,65],[-35,63],[-45,60],[-55,60],[-60,65],[-60,72],[-55,78],[-50,83]],
  [[44,-12],[48,-14],[50,-18],[50,-22],[46,-26],[44,-26],[42,-22],[42,-16],[44,-12]]
];

// ── Globe state ────────────────────────────────────────────────────────
let rotX=0.25, rotY=0.6, velX=0, velY=0;
let isDrag=false, isRight=false, lastMX=0, lastMY=0;
let autoSpin=true, pins=[], activePin=null;
let thumbCache={};  // declared separately so resize() can safely reset it

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W; canvas.height=H;
  ov.width=W; ov.height=H;
  CX=W/2; CY=H/2;
  R=Math.min(W,H)*0.33;
  thumbCache={};
}
resize();
window.addEventListener('resize',resize);

// ── 3D math ────────────────────────────────────────────────────────────
function ll2xyz(lat,lon){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return { x:-Math.sin(phi)*Math.cos(theta), y:Math.cos(phi), z:Math.sin(phi)*Math.sin(theta) };
}
function rot3d(p,rx,ry){
  let {x,y,z}=p;
  const cy=Math.cos(ry),sy=Math.sin(ry);
  let x1=x*cy+z*sy, z1=-x*sy+z*cy;
  const cx=Math.cos(rx),sx=Math.sin(rx);
  return { x:x1, y:y*cx-z1*sx, z:y*sx+z1*cx };
}

// ── Thumbnail canvas generator ─────────────────────────────────────────
function makeThumbnail(pin){
  if(thumbCache[pin.title]) return thumbCache[pin.title];
  const c=document.createElement('canvas'); c.width=184; c.height=110;
  const tc=c.getContext('2d');

  // BG gradient
  const hex=pin.color||'#1a1a3a';
  const r=parseInt(hex.slice(1,3)||'1a',16)||26;
  const g=parseInt(hex.slice(3,5)||'1a',16)||26;
  const b=parseInt(hex.slice(5,7)||'3a',16)||58;
  const grad=tc.createLinearGradient(0,0,184,110);
  grad.addColorStop(0,`rgba(${r},${g},${b},1)`);
  grad.addColorStop(1,`rgba(${Math.max(0,r-50)},${Math.max(0,g-50)},${Math.max(0,b-50)},1)`);
  tc.fillStyle=grad; tc.fillRect(0,0,184,110);

  // Pattern overlay by type
  tc.save(); tc.globalAlpha=0.1; tc.strokeStyle='#fff'; tc.lineWidth=1;
  if(pin.tag==='OTT'||pin.tag==='공연'){
    for(let x=0;x<200;x+=22){ tc.beginPath();tc.moveTo(x,0);tc.lineTo(x,110);tc.stroke(); }
    tc.strokeRect(0,0,8,12); tc.strokeRect(176,0,8,12);
    tc.strokeRect(0,98,8,12); tc.strokeRect(176,98,8,12);
  } else if(pin.tag==='스포츠'){
    for(let i=-110;i<300;i+=20){ tc.beginPath();tc.moveTo(i,0);tc.lineTo(i+110,110);tc.stroke(); }
  } else if(pin.tag==='맛집'){
    for(let i=0;i<5;i++){ tc.beginPath();tc.arc(92,55,(i+1)*18,0,Math.PI*2);tc.stroke(); }
  } else if(pin.tag==='뉴스'){
    for(let y=14;y<110;y+=13){ tc.beginPath();tc.moveTo(8,y);tc.lineTo(176,y);tc.stroke(); }
    tc.fillStyle='rgba(255,255,255,0.1)'; tc.fillRect(8,14,80,26);
  } else {
    // Photo grid
    tc.strokeRect(8,8,78,44); tc.strokeRect(98,8,78,44);
    tc.strokeRect(8,60,78,42); tc.strokeRect(98,60,78,42);
  }
  tc.restore();

  // Vignette
  const vig=tc.createRadialGradient(92,55,18,92,55,100);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.6)');
  tc.fillStyle=vig; tc.fillRect(0,0,184,110);

  // Emoji centered
  tc.font='36px serif'; tc.textAlign='center'; tc.textBaseline='middle';
  tc.fillText(pin.emoji,92,44);

  // Title at bottom
  tc.font='bold 11px -apple-system,sans-serif';
  tc.textAlign='center'; tc.textBaseline='bottom';
  tc.shadowColor='rgba(0,0,0,0.9)'; tc.shadowBlur=6;
  tc.fillStyle='rgba(255,255,255,0.95)';
  const maxW=168;
  let title=pin.title;
  while(tc.measureText(title).width>maxW&&title.length>4) title=title.slice(0,-2)+'…';
  tc.fillText(title,92,106);
  tc.shadowBlur=0;

  thumbCache[pin.title]=c;
  return c;
}

// ── 폴백: 간략화 폴리곤 (D3 로드 전 임시) ───────────────────────────
function drawLandPoly(coords){
  let started=false, prevZ=0;
  ctx.beginPath();
  for(const [lon,lat] of coords){
    const p=rot3d(ll2xyz(lat,lon),rotX,rotY);
    if(p.z<0){ started=false; prevZ=p.z; continue; }
    const sx=CX+p.x*R, sy=CY-p.y*R;
    if(!started||prevZ<0){ ctx.moveTo(sx,sy); started=true; }
    else ctx.lineTo(sx,sy);
    prevZ=p.z;
  }
  ctx.closePath();
  ctx.fillStyle='#2d5a3a'; ctx.fill();
  ctx.strokeStyle='rgba(120,200,140,0.25)'; ctx.lineWidth=0.5; ctx.stroke();
}

// ── Draw globe ─────────────────────────────────────────────────────────
function drawGlobe(){
  ctx.clearRect(0,0,W,H);

  // Background glow
  const g1=ctx.createRadialGradient(CX,CY,R*0.2,CX,CY,R*1.7);
  g1.addColorStop(0,'rgba(60,100,255,0.09)'); g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);

  // Atmosphere
  const atm=ctx.createRadialGradient(CX,CY,R*0.93,CX,CY,R*1.14);
  atm.addColorStop(0,'rgba(40,100,255,0.0)');
  atm.addColorStop(0.5,'rgba(70,150,255,0.24)');
  atm.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(CX,CY,R*1.14,0,Math.PI*2); ctx.fill();

  // Ocean
  const ocean=ctx.createRadialGradient(CX-R*0.28,CY-R*0.28,R*0.04,CX,CY,R);
  ocean.addColorStop(0,'#1a3d70');
  ocean.addColorStop(0.6,'#0a2248');
  ocean.addColorStop(1,'#050f24');
  ctx.fillStyle=ocean; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();

  // Clip everything inside globe
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();

  // Grid lines
  ctx.strokeStyle='rgba(80,140,255,0.07)'; ctx.lineWidth=0.5;
  for(let lat=-60;lat<=60;lat+=30){
    const phi=(90-lat)*Math.PI/180, r2=R*Math.sin(phi), yo=R*Math.cos(phi);
    ctx.beginPath(); ctx.ellipse(CX,CY-yo,Math.abs(r2),Math.abs(r2*0.15),0,0,Math.PI*2); ctx.stroke();
  }
  for(let i=0;i<6;i++){
    const ang=(i*30+rotY*180/Math.PI)%180;
    ctx.save(); ctx.translate(CX,CY); ctx.rotate(ang*Math.PI/180);
    ctx.beginPath(); ctx.ellipse(0,0,R*0.12,R,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ── 지도 렌더: Natural Earth (D3+TopoJSON) or 폴리곤 폴백 ──
  const usedGeo = drawNaturalEarth();
  if(!usedGeo){
    for(const poly of LAND) drawLandPoly(poly);
    if(geoLoading){
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.22)';
      ctx.font='12px -apple-system,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText('지도 데이터 로딩 중...', CX, CY+R*0.85);
      ctx.restore();
    }
  }

  // Globe highlight sheen
  const hl=ctx.createRadialGradient(CX-R*0.3,CY-R*0.3,0,CX-R*0.1,CY-R*0.1,R*0.65);
  hl.addColorStop(0,'rgba(180,220,255,0.14)'); hl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hl; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();

  // ── Pins ──
  const sorted=[...pins].sort((a,b)=>
    rot3d(ll2xyz(a.lat,a.lon),rotX,rotY).z - rot3d(ll2xyz(b.lat,b.lon),rotX,rotY).z
  );

  for(const pin of sorted){
    const p=rot3d(ll2xyz(pin.lat,pin.lon),rotX,rotY);
    pin._visible=p.z>=-0.05;
    if(!pin._visible) continue;
    const fade=Math.max(0,Math.min(1,p.z*6));
    const sx=CX+p.x*R, sy=CY-p.y*R;
    pin._sx=sx; pin._sy=sy;
    const isAct=activePin===pin;
    const scale=isAct?1.5:1.0;
    const TW=58*scale, TH=36*scale;

    ctx.save();
    ctx.globalAlpha=0.3+fade*0.7;

    // Shadow
    ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=10*scale;

    // Clip to rounded rect for thumbnail
    const rx=4*scale;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(sx-TW/2,sy-TH/2,TW,TH,rx);
    else ctx.rect(sx-TW/2,sy-TH/2,TW,TH);
    ctx.fillStyle='#000'; ctx.fill();

    ctx.shadowBlur=0;
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(sx-TW/2,sy-TH/2,TW,TH,rx);
    else ctx.rect(sx-TW/2,sy-TH/2,TW,TH);
    ctx.clip();
    ctx.drawImage(makeThumbnail(pin),sx-TW/2,sy-TH/2,TW,TH);
    ctx.restore();

    // Border
    ctx.strokeStyle=isAct?pin.color:`rgba(255,255,255,${0.35+fade*0.35})`;
    ctx.lineWidth=isAct?2.5:0.8;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(sx-TW/2,sy-TH/2,TW,TH,rx);
    else ctx.rect(sx-TW/2,sy-TH/2,TW,TH);
    ctx.stroke();

    // Active glow
    if(isAct){
      ctx.shadowColor=pin.color; ctx.shadowBlur=24;
      ctx.strokeStyle=pin.color; ctx.lineWidth=2.5;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(sx-TW/2-4,sy-TH/2-4,TW+8,TH+8,rx+4);
      else ctx.rect(sx-TW/2-4,sy-TH/2-4,TW+8,TH+8);
      ctx.stroke(); ctx.shadowBlur=0;
    }

    // Pin dot + stem
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.fillStyle=isAct?pin.color:'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(sx,sy+TH/2+5*scale,3*scale,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=isAct?pin.color:'rgba(255,255,255,0.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx,sy+TH/2); ctx.lineTo(sx,sy+TH/2+3*scale); ctx.stroke();

    ctx.restore();
  }

  ctx.restore(); // end globe clip

  // Globe rim
  ctx.strokeStyle='rgba(80,160,255,0.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke();
}

// ── Lasso 제스처 ──────────────────────────────────────────────────────
// 시계방향(CW)   → 올가미 선택
// 반시계방향(CCW) → 줌아웃 (원 크기에 비례)
let gPts=[], gActive=false, gTriggered=false;
let gLassoPins=[];
const G_MIN_PTS=12;
const G_CLOSE_DIST=60;

// Shoelace formula → 서명된 넓이 (양수=CW, 음수=CCW, Canvas Y축 아래방향이므로)
function signedArea(pts){
  let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y);
  }
  return a/2;
}

// 점이 다각형 내부에 있는지 (ray-casting)
function pointInPoly(px, py, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

// 올가미 안에 들어온 가시 핀 목록
function getPinsInLasso(pts){
  return pins.filter(pin=>{
    if(!pin._visible) return false;
    return pointInPoly(pin._sx, pin._sy, pts);
  });
}

function drawOverlay(){
  octx.clearRect(0,0,W,H);
  if(!gActive||gTriggered||gPts.length<2) return;
  // 시작점이 반드시 존재하는지 한번 더 확인
  if(!gPts[0]) return;

  const area = signedArea(gPts);
  const isCW = area > 0;   // Canvas: Y↓, CW = 양수
  const inside = isCW ? getPinsInLasso(gPts) : [];
  const hasCapture = inside.length > 0;

  // ── 궤적 선 ──
  octx.save();
  octx.beginPath();
  octx.moveTo(gPts[0].x, gPts[0].y);
  for(let i=1;i<gPts.length;i++) octx.lineTo(gPts[i].x, gPts[i].y);

  if(isCW){
    octx.strokeStyle = hasCapture ? 'rgba(80,230,140,0.75)' : 'rgba(108,99,255,0.6)';
  } else {
    octx.strokeStyle = 'rgba(255,120,60,0.7)'; // 반시계 = 주황
  }
  octx.lineWidth=2.5; octx.lineCap='round'; octx.lineJoin='round';
  octx.setLineDash([6,5]);
  octx.stroke();
  octx.setLineDash([]);

  // ── 올가미 채우기 ──
  octx.beginPath();
  octx.moveTo(gPts[0].x, gPts[0].y);
  for(let i=1;i<gPts.length;i++) octx.lineTo(gPts[i].x, gPts[i].y);
  octx.closePath();
  if(isCW){
    octx.fillStyle = hasCapture ? 'rgba(80,230,140,0.07)' : 'rgba(108,99,255,0.06)';
  } else {
    octx.fillStyle = 'rgba(255,120,60,0.06)';
  }
  octx.fill();

  // ── 시작점 ──
  octx.beginPath();
  octx.arc(gPts[0].x, gPts[0].y, 6, 0, Math.PI*2);
  if(isCW){
    octx.fillStyle = hasCapture ? 'rgba(80,230,140,0.8)' : 'rgba(108,99,255,0.7)';
  } else {
    octx.fillStyle = 'rgba(255,120,60,0.8)';
  }
  octx.fill();

  // ── 폐곡선 닫힘 감지 링 ──
  const tail = gPts[gPts.length-1];
  const distToStart = Math.hypot(tail.x-gPts[0].x, tail.y-gPts[0].y);
  if(gPts.length>G_MIN_PTS && distToStart<G_CLOSE_DIST*1.5){
    const snap = Math.max(0, 1-(distToStart/G_CLOSE_DIST));
    octx.beginPath();
    octx.arc(gPts[0].x, gPts[0].y, 6+snap*14, 0, Math.PI*2);
    octx.strokeStyle = isCW
      ? `rgba(80,230,140,${0.3+snap*0.5})`
      : `rgba(255,120,60,${0.3+snap*0.5})`;
    octx.lineWidth=2; octx.stroke();
  }

  // ── 중앙 라벨 ──
  const cx2 = gPts.reduce((s,p)=>s+p.x,0)/gPts.length;
  const cy2 = gPts.reduce((s,p)=>s+p.y,0)/gPts.length;
  octx.font='bold 13px -apple-system,sans-serif';
  octx.textAlign='center'; octx.textBaseline='middle';
  octx.shadowColor='rgba(0,0,0,0.8)'; octx.shadowBlur=6;

  if(isCW){
    if(hasCapture){
      octx.fillStyle='rgba(80,230,140,0.9)';
      octx.fillText(`${inside.length}개 선택됨`, cx2, cy2);
      // 선택된 핀 하이라이트
      for(const pin of inside){
        octx.beginPath(); octx.arc(pin._sx, pin._sy, 32, 0, Math.PI*2);
        octx.strokeStyle='rgba(80,230,140,0.7)'; octx.lineWidth=2; octx.stroke();
      }
    }
  } else {
    // 반시계: 원 크기에 따른 줌아웃 배율 미리보기
    const radius = Math.sqrt(Math.abs(area)/Math.PI);
    const zoomOut = calcZoomOutFactor(radius);
    octx.fillStyle='rgba(255,140,70,0.9)';
    octx.fillText(`줌아웃 ×${zoomOut.toFixed(1)}`, cx2, cy2);
    // 방향 화살표 힌트
    octx.font='18px sans-serif';
    octx.fillText('↺', cx2, cy2-26);
  }
  octx.shadowBlur=0;
  octx.restore();
}

// 원 반지름(px) → 줌아웃 배율
// 작은 원(50px) → ×1.3, 큰 원(300px) → ×4.0
function calcZoomOutFactor(radiusPx){
  const minR=50, maxR=350;
  const minF=1.3, maxF=4.0;
  const t=Math.max(0,Math.min(1,(radiusPx-minR)/(maxR-minR)));
  return minF+(maxF-minF)*t;
}

function triggerLasso(selectedPins){
  gTriggered=true;
  gLassoPins=selectedPins;

  // gPts 스냅샷 — 비동기 플래시 중 resetGesture로 초기화돼도 안전
  const snapPts=[...gPts];
  const cx2=snapPts.reduce((s,p)=>s+p.x,0)/snapPts.length;
  const cy2=snapPts.reduce((s,p)=>s+p.y,0)/snapPts.length;

  let flash=1.0;
  const fl=()=>{
    octx.clearRect(0,0,W,H);
    if(flash>0){
      octx.save(); octx.globalAlpha=flash*0.22; octx.fillStyle='#8fff80';
      octx.beginPath();
      octx.moveTo(snapPts[0].x,snapPts[0].y);
      for(let i=1;i<snapPts.length;i++) octx.lineTo(snapPts[i].x,snapPts[i].y);
      octx.closePath(); octx.fill();
      octx.restore(); flash-=0.07; requestAnimationFrame(fl);
    } else {
      octx.clearRect(0,0,W,H);
      if(selectedPins.length===1){ openFullscreen(selectedPins[0]); }
      else { openRegionZoom(selectedPins); }
    }
  };
  requestAnimationFrame(fl);
}

function triggerZoomOut(radiusPx){
  gTriggered=true;
  const factor = calcZoomOutFactor(radiusPx);
  const targetR = Math.max(120, R / factor);

  // gPts 스냅샷
  const snapPts=[...gPts];

  let flash=1.0;
  const fl=()=>{
    octx.clearRect(0,0,W,H);
    if(flash>0){
      octx.save(); octx.globalAlpha=flash*0.2; octx.fillStyle='#ff8040';
      octx.beginPath();
      octx.moveTo(snapPts[0].x,snapPts[0].y);
      for(let i=1;i<snapPts.length;i++) octx.lineTo(snapPts[i].x,snapPts[i].y);
      octx.closePath(); octx.fill();
      octx.restore(); flash-=0.07; requestAnimationFrame(fl);
    } else {
      octx.clearRect(0,0,W,H);
      animateGlobeZoom(rotX, rotY, targetR, ()=>{
        showToast(`줌아웃 ×${factor.toFixed(1)}`);
        if(globeZoomed) savedR=targetR;
      });
      resetGesture();
    }
  };
  requestAnimationFrame(fl);
}

// ── 지구본 영역 줌인 — R과 rotX/rotY 조작 방식 ──────────────────────
// ── 위경도 → 정면(z=1)이 되는 rotX, rotY 정확한 역산 ─────────────────
function latLonToRotation(lat, lon){
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  const px = -Math.sin(phi) * Math.cos(theta);
  const py =  Math.cos(phi);
  const pz =  Math.sin(phi) * Math.sin(theta);
  // Y축 먼저: tan(ry) = -px/pz
  const ry = Math.atan2(-px, pz);
  // Y축 회전 후 z1: -px*sin(ry)+pz*cos(ry)
  const z1 = -px * Math.sin(ry) + pz * Math.cos(ry);
  // X축: tan(rx) = py/z1
  const rx = Math.atan2(py, z1);
  return { rx, ry };
}

let globeZoomed=false;
let savedR=0, savedRotX=0, savedRotY=0;

function openRegionZoom(selectedPins){
  if(selectedPins.length===0) return;

  savedR=R; savedRotX=rotX; savedRotY=rotY;
  globeZoomed=true;

  // 평균 위도
  const avgLat = selectedPins.reduce((s,p)=>s+p.lat, 0) / selectedPins.length;

  // 경도 평균: ±180° wrap 처리 (최단 경로로 평균)
  const refLon = selectedPins[0].lon;
  let lonAcc = 0;
  for(const pin of selectedPins){
    let dl = pin.lon - refLon;
    while(dl >  180) dl -= 360;
    while(dl < -180) dl += 360;
    lonAcc += dl;
  }
  const avgLon = refLon + lonAcc / selectedPins.length;

  // 정확한 역회전각
  const { rx: targetRX, ry: targetRY } = latLonToRotation(avgLat, avgLon);

  // 핀 간 최대 구면 각도거리 (Haversine)
  const cLat = avgLat * Math.PI/180;
  const cLon = avgLon * Math.PI/180;
  let maxAng = 0;
  for(const pin of selectedPins){
    const pLat = pin.lat * Math.PI/180;
    const pLon = pin.lon * Math.PI/180;
    const dlat = pLat - cLat, dlon = pLon - cLon;
    const a = Math.sin(dlat/2)**2 + Math.cos(cLat)*Math.cos(pLat)*Math.sin(dlon/2)**2;
    maxAng = Math.max(maxAng, 2 * Math.asin(Math.sqrt(Math.min(1, a))));
  }

  // 구면 chord 길이로 R 역산: 선택 영역이 화면 75% 차지
  // 화면상 두 점의 거리 = R * 2*sin(ang/2)
  const availPx = Math.min(W, H - 180) * 0.75;
  const ang = Math.max(maxAng, 0.03); // 최소 ~1.7°
  const chord = 2 * Math.sin(ang / 2);
  let targetR = availPx / chord;

  // 상한: 화면 단축의 3배 (충분히 크게)
  const maxR = Math.min(W, H) * 3.0;
  targetR = Math.min(maxR, Math.max(R * 1.1, targetR));

  animateGlobeZoom(targetRX, targetRY, targetR, ()=>{
    showPinCards(selectedPins);
    showToast(`✨ ${selectedPins.length}개 선택 — Backspace로 돌아가기`);
  });
}

// cubic ease-out 애니메이션으로 R, rotX, rotY 이동
function animateGlobeZoom(tRX, tRY, tR, onDone){
  // rotY 최단 경로
  let dY = tRY - rotY;
  while(dY >  Math.PI) dY -= Math.PI*2;
  while(dY < -Math.PI) dY += Math.PI*2;
  const endRY = rotY + dY;
  const endRX = Math.max(-1.4, Math.min(1.4, tRX));

  const s0R=R, s0X=rotX, s0Y=rotY;
  const dur=700, t0=performance.now();
  velX=0; velY=0;

  (function tick(now){
    const t = Math.min(1, (now-t0)/dur);
    const e = 1 - (1-t)**3;
    rotX = s0X + (endRX-s0X)*e;
    rotY = s0Y + (endRY-s0Y)*e;
    R    = s0R + (tR-s0R)*e;
    if(t<1) requestAnimationFrame(tick);
    else { rotX=endRX; rotY=endRY; R=tR; if(onDone) onDone(); }
  })(t0);
}

function closeRegionZoom(){
  closePinCards();
  if(!globeZoomed) return;
  animateGlobeZoom(savedRotX, savedRotY, savedR, ()=>{ globeZoomed=false; });
  resetGesture();
  activePin=null;
}

// ── 선택된 핀 카드 패널 ────────────────────────────────────────────────
function showPinCards(selectedPins){
  let panel=document.getElementById('pin-cards');
  if(!panel){
    panel=document.createElement('div');
    panel.id='pin-cards';
    panel.style.cssText=`
      position:fixed; bottom:0; left:0; right:0;
      display:flex; gap:12px; padding:16px 20px 24px;
      background:linear-gradient(to top, rgba(6,8,15,0.98) 60%, transparent);
      z-index:50; overflow-x:auto; overflow-y:hidden;
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.2) transparent;
      opacity:0; transition:opacity 0.4s ease 0.3s;
    `;
    document.getElementById('app').appendChild(panel);
  }
  panel.innerHTML='';

  selectedPins.forEach(pin=>{
    const card=document.createElement('div');
    card.style.cssText=`
      flex:0 0 160px; height:110px; border-radius:10px; overflow:hidden;
      position:relative; cursor:pointer; border:1px solid rgba(255,255,255,0.15);
      transition:transform 0.2s, border-color 0.2s;
    `;
    card.onmouseenter=()=>{ card.style.transform='translateY(-4px)'; card.style.borderColor='rgba(255,255,255,0.4)'; };
    card.onmouseleave=()=>{ card.style.transform=''; card.style.borderColor='rgba(255,255,255,0.15)'; };
    card.onclick=()=>{ closePinCards(); closeRegionZoom(); setTimeout(()=>openFullscreen(pin),200); };

    // 이미지 배경
    if(pin.img){
      card.style.backgroundImage=`url(${pin.img})`;
      card.style.backgroundSize='cover';
      card.style.backgroundPosition='center';
    } else {
      // 컬러 폴백
      const hex=pin.color||'#1a1a3a';
      const cr=parseInt(hex.slice(1,3),16)||26, cg=parseInt(hex.slice(3,5),16)||26, cb=parseInt(hex.slice(5,7),16)||58;
      card.style.background=`linear-gradient(135deg,rgb(${cr},${cg},${cb}),rgb(${Math.max(0,cr-50)},${Math.max(0,cg-50)},${Math.max(0,cb-50)}))`;
    }

    // 하단 오버레이
    const info=document.createElement('div');
    info.style.cssText=`
      position:absolute; bottom:0; left:0; right:0; padding:8px 10px;
      background:linear-gradient(to top, rgba(0,0,0,0.88), transparent);
    `;
    info.innerHTML=`
      <div style="font-size:11px;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pin.emoji} ${pin.title}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pin.sub}</div>
    `;
    card.appendChild(info);
    panel.appendChild(card);
  });

  requestAnimationFrame(()=>{ panel.style.opacity='1'; });
}

// ── 전체화면 줌인 오버레이 ─────────────────────────────────────────────
function openFullscreen(pin){
  const el = document.getElementById('fs-overlay');
  const thumb = makeThumbnail(pin);

  // 썸네일 캔버스를 큰 캔버스로 복사
  const fc = document.getElementById('fs-canvas');
  fc.width = window.innerWidth;
  fc.height = window.innerHeight;
  const fctx = fc.getContext('2d');

  // 배경: pin 색상 그라디언트
  const hex=pin.color||'#1a1a3a';
  const cr=parseInt(hex.slice(1,3),16)||26;
  const cg=parseInt(hex.slice(3,5),16)||26;
  const cb=parseInt(hex.slice(5,7),16)||58;
  const bg=fctx.createRadialGradient(fc.width/2,fc.height/2,0,fc.width/2,fc.height/2,Math.max(fc.width,fc.height)*0.8);
  bg.addColorStop(0,`rgba(${cr},${cg},${cb},1)`);
  bg.addColorStop(1,`rgba(${Math.max(0,cr-60)},${Math.max(0,cg-60)},${Math.max(0,cb-60)},1)`);
  fctx.fillStyle=bg; fctx.fillRect(0,0,fc.width,fc.height);

  // 패턴 (확대 버전)
  fctx.save(); fctx.globalAlpha=0.06; fctx.strokeStyle='#fff'; fctx.lineWidth=2;
  if(pin.tag==='OTT'||pin.tag==='공연'){
    for(let x=0;x<fc.width+100;x+=60){ fctx.beginPath();fctx.moveTo(x,0);fctx.lineTo(x,fc.height);fctx.stroke(); }
  } else if(pin.tag==='스포츠'){
    for(let i=-fc.height;i<fc.width+fc.height;i+=50){ fctx.beginPath();fctx.moveTo(i,0);fctx.lineTo(i+fc.height,fc.height);fctx.stroke(); }
  } else if(pin.tag==='맛집'){
    for(let i=0;i<8;i++){ fctx.beginPath();fctx.arc(fc.width/2,fc.height/2,(i+1)*80,0,Math.PI*2);fctx.stroke(); }
  } else if(pin.tag==='뉴스'){
    for(let y=30;y<fc.height;y+=36){ fctx.beginPath();fctx.moveTo(40,y);fctx.lineTo(fc.width-40,y);fctx.stroke(); }
  } else {
    fctx.strokeRect(20,20,fc.width/2-30,fc.height/2-30);
    fctx.strokeRect(fc.width/2+10,20,fc.width/2-30,fc.height/2-30);
    fctx.strokeRect(20,fc.height/2+10,fc.width-40,fc.height/2-30);
  }
  fctx.restore();

  // 비네트
  const vig=fctx.createRadialGradient(fc.width/2,fc.height/2,fc.height*0.15,fc.width/2,fc.height/2,fc.height*0.8);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.65)');
  fctx.fillStyle=vig; fctx.fillRect(0,0,fc.width,fc.height);

  // 큰 이모지
  fctx.font=`${Math.min(fc.width,fc.height)*0.22}px serif`;
  fctx.textAlign='center'; fctx.textBaseline='middle';
  fctx.fillText(pin.emoji, fc.width/2, fc.height*0.38);

  // 정보 텍스트
  fctx.textAlign='center'; fctx.textBaseline='top';
  fctx.shadowColor='rgba(0,0,0,0.8)'; fctx.shadowBlur=20;
  fctx.fillStyle='rgba(255,255,255,0.95)';
  fctx.font=`bold ${Math.min(fc.width*0.04,42)}px -apple-system,sans-serif`;
  fctx.fillText(pin.title, fc.width/2, fc.height*0.6);
  fctx.font=`${Math.min(fc.width*0.022,22)}px -apple-system,sans-serif`;
  fctx.fillStyle='rgba(255,255,255,0.6)';
  fctx.fillText(pin.sub, fc.width/2, fc.height*0.6+Math.min(fc.width*0.05,52));
  fctx.font=`${Math.min(fc.width*0.018,18)}px -apple-system,sans-serif`;
  fctx.fillStyle='rgba(255,255,255,0.45)';
  fctx.fillText(pin.meta, fc.width/2, fc.height*0.6+Math.min(fc.width*0.08,84));
  fctx.shadowBlur=0;

  // 힌트 텍스트
  fctx.font=`${Math.min(fc.width*0.014,14)}px -apple-system,sans-serif`;
  fctx.fillStyle='rgba(255,255,255,0.22)';
  fctx.fillText('Backspace 키로 돌아가기', fc.width/2, fc.height-40);

  // 핀 위치에서 줌인 시작
  const startX = pin._sx / W, startY = pin._sy / H;

  el.style.transformOrigin = `${startX*100}% ${startY*100}%`;
  el.style.display = 'block';
  el.style.transform = 'scale(0.08)';
  el.style.opacity = '0';

  requestAnimationFrame(()=>{
    el.style.transition = 'transform 0.55s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease';
    el.style.transform = 'scale(1)';
    el.style.opacity = '1';
  });
}

function closeFullscreen(){
  const el = document.getElementById('fs-overlay');
  el.style.transition = 'transform 0.35s cubic-bezier(0.55,0,1,0.45), opacity 0.25s ease';
  el.style.transform = 'scale(0.08)';
  el.style.opacity = '0';
  setTimeout(()=>{ el.style.display='none'; el.style.transition=''; }, 380);
  resetGesture();
  activePin=null;
}

  if(e.key==='Backspace'){
    e.preventDefault();
    const el=document.getElementById('fs-overlay');
    if(el.style.display==='block'){ closeFullscreen(); return; }
    if(globeZoomed){ closeRegionZoom(); return; }
  }
});
function resetGesture(){ gPts=[]; gActive=false; gTriggered=false; gLassoPins=[]; }

// ── Animation loop ─────────────────────────────────────────────────────
function loop(){
  if(!isDrag){
    if(autoSpin&&pins.length===0) rotY+=0.003;
    velX*=0.93; velY*=0.93; rotX+=velX; rotY+=velY;
    rotX=Math.max(-1.2,Math.min(1.2,rotX));
  }
  drawGlobe(); drawOverlay();
  requestAnimationFrame(loop);
}
loop();

// ── Mouse events ───────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  e.preventDefault(); isDrag=true; isRight=e.button===2;
  lastMX=e.clientX; lastMY=e.clientY;
  velX=velY=0; autoSpin=false; canvas.classList.add('grabbing'); resetGesture();
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
ov.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('mousemove',e=>{
  if(isDrag){
    const dx=e.clientX-lastMX, dy=e.clientY-lastMY;
    if(isRight){ R=Math.max(120,Math.min(Math.min(W,H)*3.0,R-dy)); }
    else{ velY=dx*0.006; velX=dy*0.006; rotY+=dx*0.006; rotX+=dy*0.006; rotX=Math.max(-1.2,Math.min(1.2,rotX)); }
    lastMX=e.clientX; lastMY=e.clientY; return;
  }
  if(pins.length===0) return;
  if(gTriggered) return;

  const mx=e.clientX, my=e.clientY;

  // 마우스 버튼을 누르지 않고 움직일 때만 올가미 인식
  // gActive는 첫 번째 점이 핀 근처에서 시작됐을 때 활성화
  if(!gActive){
    // 어느 핀 근처(150px 이내)에서 시작해야 올가미 시작
    let nearPin=false;
    for(const pin of pins){
      if(!pin._visible) continue;
      if(Math.hypot(mx-pin._sx,my-pin._sy)<150){ nearPin=true; break; }
    }
    if(nearPin){
      gActive=true;
      gPts=[{x:mx,y:my}];
    }
    return;
  }

  // 올가미 궤적 추가
  const last=gPts[gPts.length-1];
  if(Math.hypot(mx-last.x,my-last.y)>4){
    gPts.push({x:mx,y:my});
  }
  // 메모리 제한: 앞을 잘라낼 때 반드시 시작점(gPts[0])은 보존
  if(gPts.length>500){
    const start=gPts[0];
    gPts.splice(1,1); // 두 번째 점만 제거 → 시작점 유지
  }

  // 폐곡선 판정: 시작점에 충분히 가까워졌을 때
  if(gPts.length>G_MIN_PTS){
    const distToStart=Math.hypot(mx-gPts[0].x, my-gPts[0].y);
    if(distToStart<G_CLOSE_DIST){
      const area = signedArea(gPts);
      const isCW = area > 0;

      if(isCW){
        // 시계방향 → 올가미 선택
        const selected=getPinsInLasso(gPts);
        if(selected.length>0){ triggerLasso(selected); }
        else { resetGesture(); }
      } else {
        // 반시계방향 → 줌아웃
        // 원 크기: Shoelace 넓이에서 등가 반지름 계산
        const radiusPx = Math.sqrt(Math.abs(area)/Math.PI);
        triggerZoomOut(radiusPx);
      }
    }
  }
});

window.addEventListener('mouseup',e=>{
  if(!isDrag) return; isDrag=false; canvas.classList.remove('grabbing');
  if(!isRight){
    const mx=e.clientX, my=e.clientY;
    for(const pin of pins){
      if(!pin._visible) continue;
      const TW=58, TH=36;
      if(Math.abs(mx-pin._sx)<TW/2+6&&Math.abs(my-pin._sy)<TH/2+6){ activePin=pin; showDetail(pin); return; }
    }
  }
  if(!gTriggered) resetGesture();
});

// 마우스가 캔버스를 벗어나면 올가미 리셋
canvas.addEventListener('mouseleave', ()=>{ if(!gTriggered) resetGesture(); });
ov.addEventListener('mouseleave', ()=>{ if(!gTriggered) resetGesture(); });

// ── UI helpers ─────────────────────────────────────────────────────────
function showDetail(pin){
  const dc=document.getElementById('d-thumb');
  dc.getContext('2d').drawImage(makeThumbnail(pin),0,0,184,110);
  document.getElementById('d-title').textContent=pin.title;
  document.getElementById('d-sub').textContent=pin.sub;
  document.getElementById('d-tag').textContent=pin.tag;
  document.getElementById('d-meta').textContent=pin.meta;
  document.getElementById('detail').classList.add('show');
}
function closeDetail(){ document.getElementById('detail').classList.remove('show'); activePin=null; }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

function detectIntent(t){
  t=t.toLowerCase();
  if(/ott|드라마|영화|시리즈|스트리밍/.test(t)) return 'ott';
  if(/스포츠|중계|mlb|nba|f1|축구|야구|농구/.test(t)) return 'sports';
  if(/맛집|식당|음식|레스토랑|밥|먹/.test(t)) return 'food';
  if(/사진|포토|앨범|photo|구글/.test(t)) return 'photos';
  if(/뉴스|news|소식|기사/.test(t)) return 'news';
  if(/음악|콘서트|공연|뮤직/.test(t)) return 'music';
  return null;
}
function loadIntent(key,btn){
  document.querySelectorAll('.qbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  pins=DATASETS[key].map(p=>({...p}));
  activePin=null; closeDetail(); autoSpin=false; resetGesture(); thumbCache={};
  showToast(`핀 ${pins.length}개 배치 완료`);
}
function handlePrompt(){
  const val=document.getElementById('prompt-input').value.trim(); if(!val) return;
  const intent=detectIntent(val);
  if(!intent){ showToast('💡 OTT · 스포츠 · 맛집 · 사진 · 뉴스 · 공연'); return; }
  loadIntent(intent,null); document.getElementById('prompt-input').value='';
}
document.getElementById('prompt-input').addEventListener('keydown',e=>{ if(e.key==='Enter') handlePrompt(); });
