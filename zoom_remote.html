<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>줌 리모컨</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body { margin: 0; background: #121212; color: #fff; font-family: -apple-system, 'Noto Sans KR', sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #conn { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #444; }
  #conn.ok { background: #1b8f3c; }
  #zoomVal { font-size: 64px; font-weight: 700; text-align: center; margin: 8px 0 2px; }
  #maxInfo { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 18px; }
  .holdRow { display: flex; gap: 12px; margin-bottom: 18px; }
  .hold { flex: 1; height: 96px; font-size: 40px; font-weight: 700; border: none; border-radius: 16px; background: #2a2a2a; color: #fff; }
  .hold:active, .hold.on { background: #0a84ff; }
  #presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .preset { height: 56px; font-size: 18px; border: none; border-radius: 12px; background: #2a2a2a; color: #fff; position: relative; }
  .preset:active { background: #0a84ff; }
  .preset .x { position: absolute; top: 2px; right: 6px; font-size: 14px; color: #ff6b6b; display: none; }
  body.edit .preset .x { display: block; }
  #editBar { margin-top: 14px; display: none; gap: 8px; }
  body.edit #editBar { display: flex; }
  #newPreset { flex: 1; height: 44px; font-size: 18px; border-radius: 10px; border: 1px solid #555; background: #1e1e1e; color: #fff; padding: 0 10px; }
  .small { height: 44px; padding: 0 16px; border: none; border-radius: 10px; background: #2a2a2a; color: #fff; font-size: 15px; }
  #msg { margin-top: 14px; text-align: center; color: #ffb74d; font-size: 13px; min-height: 18px; }
  #diag { margin-top: 6px; text-align: center; color: #8e8e93; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <div class="row">
    <strong>줌 리모컨</strong>
    <span id="conn">연결 중…</span>
  </div>

  <div id="zoomVal">--</div>
  <div id="maxInfo">최대 --x</div>

  <div class="holdRow">
    <button class="hold" id="btnOut">−</button>
    <button class="hold" id="btnIn">+</button>
  </div>

  <div class="row"><strong style="font-size:14px">프리셋</strong><button class="small" id="btnEdit">편집</button></div>
  <div id="presets"></div>
  <div id="editBar">
    <input id="newPreset" type="number" inputmode="decimal" step="0.1" min="1" placeholder="배율 (예: 4)">
    <button class="small" id="btnAdd">추가</button>
    <button class="small" id="btnReset">기본값</button>
  </div>
  <div id="msg"></div>
  <div id="diag"></div>

<script>
const TARGET_ID = 'jjremote';           // 폰 앱(zoom_receiver.html)의 고정 PeerJS ID
const STEP = 0.1;                       // 누르고 있는 동안 한 번에 변하는 배율
const REPEAT_MS = 120;                  // 반복 전송 간격
const DEFAULT_PRESETS = [1, 2, 3, 5, 8, 10];   // ← 프리셋 기본값(웹에서 정의, 앱 설정보다 우선)
const LS_KEY = 'zoom_presets_v1';

let peer = null, conn = null;
let status = { zoom: 1, max: 20, canZoom: true };
let presets = loadPresets();

function loadPresets() {
    try { const a = JSON.parse(localStorage.getItem(LS_KEY)); if (Array.isArray(a) && a.length) return a; } catch (e) {}
    return DEFAULT_PRESETS.slice();
}
function savePresets() { try { localStorage.setItem(LS_KEY, JSON.stringify(presets)); } catch (e) {} }

function setConn(ok) {
    const el = document.getElementById('conn');
    el.textContent = ok ? '연결됨' : '연결 중…';
    el.className = ok ? 'ok' : '';
}
function say(t) { document.getElementById('msg').textContent = t || ''; }
// 연결 진단 문구(안 붙을 때 어느 쪽 문제인지 보이게)
function setDiag(t) { document.getElementById('diag').textContent = t || ''; }

function render() {
    document.getElementById('zoomVal').textContent = status.zoom.toFixed(1) + 'x';
    document.getElementById('maxInfo').textContent = '최대 ' + status.max.toFixed(1) + 'x';
    say(status.canZoom ? '' : '현재 카메라 소스에서는 줌을 사용할 수 없습니다.');
    const box = document.getElementById('presets');
    box.innerHTML = '';
    presets.slice().sort((a, b) => a - b).forEach(p => {
        const b = document.createElement('button');
        b.className = 'preset';
        b.textContent = p + 'x';
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
        b.appendChild(x);
        b.addEventListener('click', () => {
            if (document.body.classList.contains('edit')) { presets = presets.filter(v => v !== p); savePresets(); render(); }
            else send({ type: 'zoomTo', value: p });
        });
        box.appendChild(b);
    });
}

function send(msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) {} }

// ── 연결 관리: 시그널링 피어(peer)는 최대한 유지하고, 폰으로의 데이터 연결(conn)만 빠르게 재시도 ──
let lastRx = 0;          // 폰에서 마지막으로 받은 시각(하트비트 응답 포함)
let lastAttempt = 0;     // 마지막 conn 시도 시각
let retryTimer = null;

function scheduleOpen(ms) {
    if (retryTimer) return;
    retryTimer = setTimeout(() => { retryTimer = null; openConn(); }, ms);
}

const PENDING_MS = 15000;   // 협상 중(아직 안 열린) 연결은 이 시간 동안 끊지 않고 기다림
let retryPeer = null;
let iceDiscSince = 0;

// WebRTC 상태로 '열려 있지만 사실상 죽은' 연결 감지(백그라운드 복귀 직후 등)
function iceDead(c) {
    try {
        const pc = c && c.peerConnection;
        if (!pc) return false;
        const s = pc.iceConnectionState;
        if (s === 'failed' || s === 'closed') return true;
        if (s === 'disconnected') {
            if (!iceDiscSince) iceDiscSince = Date.now();
            return Date.now() - iceDiscSince > 5000;
        }
        iceDiscSince = 0;
    } catch (e) {}
    return false;
}

function openConn(force) {
    if (!peer || peer.destroyed || !peer.open) return;
    // 협상 중인 연결을 너무 일찍 끊고 새로 시작하면(느린 ICE/TURN) 영영 못 붙을 수 있어 일정 시간 기다림
    if (!force && conn && !conn.open && Date.now() - lastAttempt < PENDING_MS) return;
    lastAttempt = Date.now();
    try { if (conn) { const old = conn; conn = null; old.close(); } } catch (e) {}
    iceDiscSince = 0;
    const c = peer.connect(TARGET_ID, { reliable: true });
    conn = c;
    c.on('open', () => { lastRx = Date.now(); setConn(true); setDiag(''); send({ type: 'status' }); });
    c.on('data', d => {
        lastRx = Date.now();
        if (d && d.type === 'status') { status = { zoom: +d.zoom, max: +d.max, canZoom: !!d.canZoom }; render(); }
    });
    // 끝난 연결은 비워서(conn=null) 다음 시도가 '대기 중' 가드에 막히지 않게 함
    const lost = () => { if (conn === c) { conn = null; setConn(false); setDiag('연결이 끊겼어요 — 다시 연결 중…'); scheduleOpen(800); } };
    c.on('close', lost);
    c.on('error', lost);
}

function connect() {   // 피어 새로 생성(최초/치명적 오류 시)
    try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
    conn = null;
    setConn(false);
    setDiag('시그널링 서버에 연결 중…');
    const p = new Peer();
    peer = p;
    p.on('open', () => { if (p === peer) { setDiag('폰(앱)에 연결 중…'); openConn(true); } });
    p.on('disconnected', () => { if (p === peer && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
    p.on('error', err => {
        if (p !== peer) return;   // 교체된 이전 피어의 에러는 무시(정상 피어를 다시 끊는 연쇄 방지)
        setConn(false);
        if (err && err.type === 'peer-unavailable') {   // 폰이 아직 ID 등록 전 → 피어 유지, 1초 뒤 재시도
            conn = null;
            setDiag('폰(앱)이 서버에 없어요 — 방송 중인지, 앱의 "원격 줌 허용"이 켜져 있는지 확인하세요 (자동 재시도 중)');
            scheduleOpen(1000);
        } else if (!retryPeer) {                        // 그 외 오류 → 피어 재생성(중복 예약 방지)
            setDiag('서버 연결 오류(' + ((err && err.type) || '알 수 없음') + ') — 다시 시도 중…');
            retryPeer = setTimeout(() => { retryPeer = null; if (p === peer) connect(); }, 2000);
        }
    });
}

// 하트비트(2초): 연결되어 있으면 ping, 6초간 응답 없거나 WebRTC가 죽었으면 즉시 재연결. 끊겼으면 재시도(협상 중이면 대기).
function heartbeat() {
    if (retryPeer) return;   // 피어 재생성 예약 중
    if (!peer || peer.destroyed) { connect(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return; }
    if (conn && conn.open) {
        send({ type: 'ping' });
        if (Date.now() - lastRx > 6000 || iceDead(conn)) { setConn(false); openConn(true); }
    } else if (peer.open) {
        if (conn && !conn.open) setDiag('폰(앱)에 연결 중… ' + Math.round((Date.now() - lastAttempt) / 1000) + '초');
        openConn(false);
    }
}

// 화면/앱 복귀(백그라운드 후): 즉시 점검 + 열린 연결은 2.5초 안에 응답 없으면 죽은 것으로 보고 재연결
function onResume() {
    heartbeat();
    if (conn && conn.open) {
        const t0 = Date.now();
        send({ type: 'ping' });
        setTimeout(() => { if (conn && conn.open && lastRx < t0) { setConn(false); openConn(true); } }, 2500);
    }
}

// 누르고 있는 동안 STEP씩 반복
function bindHold(id, dir) {
    const el = document.getElementById(id);
    let timer = null;
    const tick = () => send({ type: 'zoomBy', delta: dir * STEP });
    const start = e => { e.preventDefault(); if (timer) return; el.classList.add('on'); tick(); timer = setInterval(tick, REPEAT_MS); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } el.classList.remove('on'); };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, stop));
    window.addEventListener('blur', stop);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
}
bindHold('btnIn', +1);
bindHold('btnOut', -1);

document.getElementById('btnEdit').addEventListener('click', () => document.body.classList.toggle('edit'));
document.getElementById('btnAdd').addEventListener('click', () => {
    const v = parseFloat(document.getElementById('newPreset').value);
    if (!isFinite(v) || v < 1) return;
    const r = Math.round(v * 10) / 10;
    if (!presets.includes(r)) { presets.push(r); savePresets(); render(); }
    document.getElementById('newPreset').value = '';
});
document.getElementById('btnReset').addEventListener('click', () => { presets = DEFAULT_PRESETS.slice(); savePresets(); render(); });

setInterval(heartbeat, 2000);
// 화면 복귀/네트워크 복구 시 즉시 점검
document.addEventListener('visibilitychange', () => { if (!document.hidden) onResume(); });
window.addEventListener('online', onResume);
window.addEventListener('focus', onResume);
window.addEventListener('pageshow', onResume);   // 뒤로가기 캐시(bfcache) 복원 대비

render();
connect();
</script>
</body>
</html>
